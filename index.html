                    ['Proizvod',<button type="button" className="catalog-open" onClick={()=>onOpen(w)}>{textValue(w.name)||'Bez naziva'}</button>],['Kategorija',categoryLabel(w.category)],['Prodavnica',textValue(w.store)||'—'],['Kupljeno',fmtDate(parseDate(w.purchaseDate))],['Ističe',fmtDate(exp)],['Status',getStyle(days).l],['Opis',textValue(w.description)||'—'],['Prilozi',legacyAttachments(w).length+attachmentRefs(w).length]
                ].map(([label,value])=><td role="cell" key={label}><span className="catalog-cell-label">{label}: </span>{value}</td>)}</tr>)}</tbody></table>:
                <div className={mode==='cards'?'products-grid':'products-list'}>{(listState==='ready'?rows:[]).map(({w,exp,days})=> mode==='list'?
                    <button type="button" key={w.id} onClick={()=>onOpen(w)} className="product-list-link"><CategoryIcon category={w.category}/><span><strong className="list-name">{textValue(w.name)||'Bez naziva'}</strong><span className="list-meta"><span>{categoryLabel(w.category)}</span><span>Ističe: {fmtDate(exp)}</span></span></span><StatusPill days={days}/></button>:
                    <article className="product-card" key={w.id}><button type="button" onClick={()=>onOpen(w)} className="product-link"><span className="product-top"><CategoryIcon category={w.category}/><StatusPill days={days}/></span><span><span className="product-category">{categoryLabel(w.category)}</span><strong className="product-name">{textValue(w.name)||'Bez naziva'}</strong></span><span className="product-bottom"><span>Garancija važi do<strong>{fmtDate(exp)}</strong></span><span className="arrow"><Icon name="chevron-right"/></span></span></button></article>
                )}</div>}
            </section>;
        }

        function App() {
            const [warranties, setWarranties] = useState([]);
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [view, setView] = useState('list');
            const [selected, setSelected] = useState(null);
            const [search, setSearch] = useState('');
            const [listState, setListState] = useState('loading');
            const [retry, setRetry] = useState(0);
            const [authError, setAuthError] = useState('');
            const [formBusy, setFormBusy] = useState(false);
            const [notice, setNotice] = useState('');
            const [attachmentSection, setAttachmentSection] = useState(false);
            const mainRef = useRef(null);
            const headingInputMode = useRef('automatic');
            useEffect(() => {
                const markHeadingInput = event => {
                    headingInputMode.current = event.type === 'keydown' ? 'keyboard' : 'pointer';
                    const heading = document.activeElement;
                    if (heading?.matches('.hero h1[data-page-heading]')) heading.dataset.headingFocus = headingInputMode.current;
                };
                document.addEventListener('keydown', markHeadingInput, true);
                document.addEventListener('pointerdown', markHeadingInput, true);
                return () => {
                    document.removeEventListener('keydown', markHeadingInput, true);
                    document.removeEventListener('pointerdown', markHeadingInput, true);
                };
            }, []);
            const finishNavigation = next => { setView(next); setAttachmentSection(false); };
            const navigate = next => { if (!formBusy) finishNavigation(next); };
            useEffect(() => {
                const frame=requestAnimationFrame(()=>{
                    const target=attachmentSection?mainRef.current?.querySelector('#attachment-section'):[...(mainRef.current?.querySelectorAll('[data-page-heading]')||[])].find(el=>el.getClientRects().length);
                    if(target){
                        if(target.matches('.hero h1[data-page-heading]')) target.dataset.headingFocus=headingInputMode.current;
                        target.focus({preventScroll:true});target.scrollIntoView({block:'start'});
                    }
                });
                return()=>cancelAnimationFrame(frame);
            },[view,user?.uid,attachmentSection]);

            useEffect(() => {
                let unsubscribe, active = true;
                setLoading(true); setAuthError('');
                const fail = () => { if (active) { setAuthError('Povezivanje nije uspelo. Pokušajte ponovo.'); setLoading(false); } };
                const connect = () => {
                    if (!window.firebaseDeps) return;
                    clearInterval(timer); clearTimeout(timeout);
                    try {
                        unsubscribe = window.firebaseDeps.onAuthStateChanged(window.firebaseDeps.auth, u => {
                            if (!active) return;
                            setUser(u); setWarranties([]); setSelected(null); setView('list'); setLoading(false);
                        }, fail);
                    } catch { fail(); }
                };
                const timer = setInterval(connect, 100);
                const timeout = setTimeout(() => { clearInterval(timer); fail(); }, 10000);
                connect();
                return () => { active = false; clearInterval(timer); clearTimeout(timeout); if (unsubscribe) unsubscribe(); };
            }, [retry]);

            useEffect(() => {
                if (!user || !window.firebaseDeps) return;
                let active = true, unsubscribe;
                setListState('loading');
                const { db, appId, collection, onSnapshot } = window.firebaseDeps;
                const fail = () => { if (active) setListState('error'); };
                try {
                    unsubscribe = onSnapshot(collection(db, 'artifacts', appId, 'users', user.uid, 'warranties'), snapshot => {
                        if (!active) return;
                        setWarranties(snapshot.docs.map(d => ({ ...d.data(), id: d.id })).filter(w => w.id !== 'gp-live-integration-test-001'));
                        setListState('ready');
                    }, fail);
                } catch { fail(); }
                return () => { active = false; if (unsubscribe) unsubscribe(); };
            }, [user, retry]);

            const openForm = (record=null,focusAttachments=false) => {
                if(formBusy)return;
                try { const d=window.attachmentService.getDraft(user.uid);
                    if (record && !draftMatchesRecord(d, record)) throw new Error(draftConflictMessage);
                    setAuthError(''); setAttachmentSection(focusAttachments);
                    if(d) { setSelected(d.edit ? (warranties.find(w=>w.id===d.id)||{id:d.id}) : null); setView(d.edit?'edit':'add'); }
                    else {setSelected(record);setView(record?'edit':'add');}
                } catch(e) {setAuthError(e.message);}
            };
            const login = async () => {
                try { setAuthError(''); await window.firebaseDeps.signInWithPopup(window.firebaseDeps.auth, window.firebaseDeps.provider); }
                catch { setAuthError('Prijava nije uspela. Pokušajte ponovo.'); }
            };
            const logout = async () => {
                try { window.attachmentService.disconnect(); await window.firebaseDeps.signOut(window.firebaseDeps.auth); }
                catch { setAuthError('Odjava nije uspela. Pokušajte ponovo.'); }
            };

            if (loading) return <div role="status" className="min-h-screen flex items-center justify-center">Učitavanje...</div>;
            if (authError && !window.firebaseDeps) return <div role="alert" className="p-6">{authError} <button onClick={() => setRetry(r => r + 1)}>Pokušaj ponovo</button></div>;

            if (!user) return (
                <div className="min-h-screen flex items-center justify-center p-6 bg-slate-100">
                    <div className="bg-white p-8 rounded-2xl shadow-xl text-center max-w-sm w-full">
                        <Icon name="shield-check" className="w-12 h-12 text-blue-600 mx-auto mb-4" />
                        <h1 className="text-2xl font-bold mb-6">GarancijePro</h1>
                        {authError && <p role="alert">{authError} <button onClick={() => setRetry(r => r + 1)}>Pokušaj ponovo</button></p>}
                        <button onClick={login} className="w-full bg-slate-900 text-white py-3 rounded-xl font-bold flex items-center justify-center gap-2">
                            <Icon name="log-in" className="w-5 h-5" /> Prijavi se Google-om
                        </button>
                    </div>
                </div>
            );

            return <div className="gp-app">
                <a href="#app-main" className="skip-link">Pređi na sadržaj</a>
                <header className="app-header"><div className="gp-container header-inner">
                    <button type="button" className="brand quiet" disabled={formBusy} onClick={()=>navigate('list')}><span className="brand-mark"><Icon name="shield-check"/></span><span>GarancijePro</span></button>
                    <div className="header-right"><button type="button" aria-label="Podešavanja" disabled={formBusy} onClick={()=>navigate('settings')}><Icon name="settings"/></button></div>
                </div></header>
                <main className="gp-container" id="app-main" ref={mainRef} tabIndex={-1}>
                    {notice&&<p role="status" className="toast">{notice}</p>}{authError&&<p role="alert" className="error">{authError}</p>}
                    {view!=='list'&&view!=='settings'&&<div className="context-drive"><DriveConnection compact/></div>}
                    <div hidden={view!=='list'}>
                        <section className="hero"><p className="section-label">VAŠA DIGITALNA EVIDENCIJA</p><h1 data-page-heading tabIndex={-1}>Računi i garancije</h1><p>Uredno složeni i uvek pri ruci. Više reda, manje traženja.</p><button type="button" className="primary icon-button" disabled={formBusy} onClick={()=>openForm()}><Icon name="plus"/>Dodaj proizvod</button></section>
                        {view==='list'&&<DriveConnection compact/>}
                        <button type="button" className="resume-draft" disabled={formBusy} onClick={()=>openForm()}>Nastavi nacrt / novi unos</button>
                        <Catalog key={user.uid} records={warranties} user={user} listState={listState} onRetry={()=>setRetry(r=>r+1)} onOpen={w=>{setSelected(w);navigate('detail');}}/>
                    </div>
                    {(view==='add'||view==='edit')&&<div className="page-content"><AddForm key={view==='edit'?selected.id:'new'} initial={view==='edit'?selected:null} onBusy={setFormBusy} onCancel={()=>finishNavigation(view==='edit'?'detail':'list')} onSave={()=>finishNavigation('list')} onDiscard={()=>{setSelected(null);setAuthError('');finishNavigation('list');setNotice('Nacrt je odbačen.');}} user={user}/></div>}
                    {view==='detail'&&selected&&<Detail onEdit={()=>openForm(selected)} onAddAttachment={()=>openForm(selected,true)} onBusy={setFormBusy} item={selected} onBack={()=>finishNavigation('list')} user={user}/>}
                    {view==='settings'&&<section className="page-content settings-shell"><button type="button" className="quiet back-button" disabled={formBusy} onClick={()=>navigate('list')}><Icon name="arrow-left"/>Moja evidencija</button><h1 data-page-heading tabIndex={-1}>Podešavanja</h1><section className="panel"><h2>Nalog</h2><p className="account-name">{textValue(user.email)||'Prijavljeni nalog'}</p><button type="button" className="detail-actions" disabled={formBusy} onClick={logout}><Icon name="log-out"/> Odjavi se</button></section><section className="panel"><DriveConnection/></section><section className="panel"><h2>Verzija i nacrt</h2><p>Verzija {RELEASE_VERSION}</p><button type="button" className="detail-actions" disabled={formBusy} onClick={()=>openForm()}>Nastavi nacrt / novi unos</button></section></section>}
                    <nav className="bottom-nav" aria-label="Glavna navigacija">
                        <button type="button" aria-current={view==='list'?'page':undefined} disabled={formBusy} onClick={()=>navigate('list')}><Icon name="layout-grid"/><span>Proizvodi</span></button>
                        <button type="button" aria-current={view==='add'||view==='edit'?'page':undefined} disabled={formBusy||view==='add'||view==='edit'} onClick={()=>openForm()}><Icon name="plus"/><span>Dodaj</span></button>
                        <button type="button" aria-current={view==='settings'?'page':undefined} disabled={formBusy} onClick={()=>navigate('settings')}><Icon name="settings"/><span>Podešavanja</span></button>
                    </nav>
                </main><AppFooter/>
            </div>;
        }

        function AddForm({ onCancel, onSave, onDiscard, onBusy, user, initial = null }) {
            const service = window.attachmentService;
            const savedDraft = service.getDraft(user.uid);
            const draftConflict = !draftMatchesRecord(savedDraft, initial);
            const restored = useRef(draftConflict ? null : savedDraft);
            const draftOperation = useRef(restored.current?.operationId || 'op-' + crypto.randomUUID());
            const disposed = useRef(false), discardingRef = useRef(false);
            const [discarding, setDiscarding] = useState(false);
            const [sealed, setSealed] = useState(!!restored.current?.sealed);
            const [form, setForm] = useState(() => ({
                name: textValue(initial?.name), category: textValue(initial?.category),
                purchaseDate: initial ? (parseDate(initial.purchaseDate) ? initial.purchaseDate : '') : '',
                baseMonths: initial ? (monthsValue(initial.baseMonths, 1) ?? '') : 24,
                extendedMonths: initial ? (monthsValue(initial.extendedMonths ?? 0, 0) ?? '') : 0,
                store: textValue(initial?.store), description: textValue(initial?.description),
                purchasePrice: priceText(restored.current?.metadata?.purchasePriceMinor??initial?.purchasePriceMinor),currency:textValue(initial?.currency),invoiceNumber:textValue(initial?.invoiceNumber),fiscalReceiptUrl:textValue(initial?.fiscalReceiptUrl),
                ...restored.current?.metadata
            }));
            const [attachments, setAttachments] = useState(() => restored.current?.attachments || attachmentRefs(initial));
            const [pending, setPending] = useState(() => restored.current?.pending || []);
            const pendingUrls = useRef(new Set());
            const cameraInput = useRef(null), galleryInput = useRef(null);

            const legacy = legacyAttachments(initial);
            const needsService = pending.length > 0 || attachments.length > 0;
            const malformedAttachments = initial?.attachments != null && (!Array.isArray(initial.attachments) || attachmentRefs(initial).length !== initial.attachments.length);
            const [saving, setSaving] = useState(false);
            const [processing, setProcessing] = useState(false);
            const [error, setError] = useState('');
            const [imageError, setImageError] = useState('');
            const savingRef = useRef(false), processingRef = useRef(0);
            const mounted = useRef(true);
            useEffect(() => {
                mounted.current = true;
                return () => { mounted.current = false; for (const url of pendingUrls.current) URL.revokeObjectURL(url); };
            }, []);
            useEffect(() => { onBusy(saving || discarding || processing); return () => onBusy(false); }, [saving, discarding, processing, onBusy]);
            useEffect(() => {
                if (!mounted.current || disposed.current || discardingRef.current) return;
                try {
                    if (!draftMatchesRecord(service.getDraft(user.uid), initial)) throw new Error(draftConflictMessage);
                    const {id, ...base} = initial || {}; service.stageDraft({userId:user.uid,id:initial?.id || null,base:initial ? base : null,metadata:form,attachments,pending,operationId:draftOperation.current});
                }
                catch(e) { setError(e.message); }
            }, [form,attachments,pending]);
            const change = (field, value) => { if(!sealed && !disposed.current && !discardingRef.current) setForm(previous => ({ ...previous, [field]: value })); };
            const [qrNotice,setQrNotice]=useState('');
            const qrCurrent=()=>{try{const d=service.getDraft(user.uid);return mounted.current&&!disposed.current&&!discardingRef.current&&!savingRef.current&&!sealed&&d?.operationId===draftOperation.current&&draftMatchesRecord(d,initial);}catch{return false;}};
            const applyQR=proposal=>{if(!qrCurrent())return;const result=mergeReceipt(form,proposal);setForm(result.next);const names={name:'naziv',store:'prodavnica',purchaseDate:'datum',purchasePrice:'cena',currency:'valuta',invoiceNumber:'broj računa',fiscalReceiptUrl:'fiskalni link'};setQrNotice(result.kept.length?'Zadržana popunjena polja: '+result.kept.map(k=>names[k]).join(', ')+'.':'Podaci su preneti u formu. Pregledajte ih i dopunite kategoriju i trajanje. Garancija nije sačuvana.');};
            const expiry = calcExp(form.purchaseDate, form.baseMonths, form.extendedMonths);

            const handleFile = async e => {
                if (disposed.current || discardingRef.current || savingRef.current || processingRef.current) return;
                const files = Array.from(e.target.files); e.target.value = '';
                if (!files.length) return;
                processingRef.current++; setProcessing(true); setImageError('');
                try {
                    const results = await Promise.allSettled(files.map(readAttachment));
                    const good = results.filter(r => r.status === 'fulfilled').map(r => r.value);
                    if (!mounted.current || disposed.current || discardingRef.current) { for (const a of good) URL.revokeObjectURL(a.dataUrl); return; }
                    for (const a of good) pendingUrls.current.add(a.dataUrl);
                    setPending(previous => {
                        if (disposed.current || discardingRef.current) return previous;
                        const result=[...previous];
                        for(const a of good) {
                            const index=result.findIndex(p=>!p.original && p.sha256===a.sha256 && p.size===a.size);
                            if(index>=0) result[index]={...a,id:result[index].id,kind:result[index].kind};
                            else if(!sealed) result.push(a);
                            else setImageError('Izabrani fajl ne odgovara originalima sačuvanog nacrta.');
                        } return result;
                    });
                    const failed = results.filter(r => r.status === 'rejected').length;
                    if (failed) setImageError(failed + ' slika nije obrađeno. Prethodni prilozi su sačuvani; izaberite neuspele slike ponovo.');
                } finally {
                    processingRef.current--;
                    if (mounted.current) setProcessing(processingRef.current > 0);
                }
            };
            const changeKind = (id, kind) => {
                if (disposed.current || discardingRef.current) return;
                setAttachments(previous => previous.map(a => a.id === id ? { ...a, kind } : a));
                setPending(previous => previous.map(a => a.id === id ? { ...a, kind } : a));
            };

            const submit = async e => {
                e.preventDefault();
                if (disposed.current || discardingRef.current) return;
                if (draftConflict) { setError(draftConflictMessage); return; }
                if (savingRef.current || processingRef.current) return;
                if (!form.name.trim() || !expiry || form.purchaseDate > dateInput() || form.description.length > 150) {
                    setError('Unesite naziv, ispravan datum kupovine koji nije u budućnosti, celo trajanje u mesecima i opis do 150 karaktera.');
                    return;
                }
                try { const data=formMetadata(form,initial); if(data.purchasePriceMinor!==undefined&&!/^[A-Z]{3}$/.test(data.currency||''))throw Error('Uz cenu izaberite valutu od tri velika slova, npr. EUR.'); if(data.currency&&!/^[A-Z]{3}$/.test(data.currency))throw Error('Valuta mora imati tri velika slova.'); if(data.invoiceNumber&&data.invoiceNumber.length>200)throw Error('Broj računa je predugačak.'); if(data.fiscalReceiptUrl)fiscalLink(data.fiscalReceiptUrl); } catch(e){setError(e.message);return;}
                if (malformedAttachments) { setError('Postojeći podaci o prilozima nisu podržani. Čuvanje je zaustavljeno da bi ostali očuvani.'); return; }
                if (needsService && !service?.saveWarranty) { setError('Servis priloga nije konfigurisan. Nema čuvanja niti slanja priloga. Unos ostaje u formi.'); return; }
                savingRef.current = true; setSaving(true); setError('');
                try {
                    if (!draftMatchesRecord(service.getDraft(user.uid), initial)) throw new Error(draftConflictMessage);
                    const {id, ...base} = initial || {};
                    const data = formMetadata(form, initial);
                    service.stageDraft({userId:user.uid,id:initial?.id || null,base:initial ? base : null,metadata:data,attachments,pending,operationId:draftOperation.current});
                    setSealed(true);
                    await service.saveWarranty({userId:user.uid,newAttachments:pending});
                    if (mounted.current) onSave();
                } catch (error) {
                    if (mounted.current) setError('Čuvanje nije uspelo. Unos je sačuvan u ovoj formi. ' + error.message);
                } finally {
                    savingRef.current = false;
                    if (mounted.current) setSaving(false);
                }
            };

            const discard = async () => {
                if (disposed.current || discardingRef.current || savingRef.current || processingRef.current || sealed) return;
                discardingRef.current = true; setDiscarding(true);
                try {
                    const d = service.getDraft(user.uid);
                    if (!d || !draftMatchesRecord(d, initial) || d.operationId !== draftOperation.current) throw new Error('Nacrt se promenio. Odbacivanje je zaustavljeno.');
                    const expected = window.garancijeFingerprint(d);
                    if (!window.confirm('Odbaci ovaj nezavršeni nacrt? Njegovi nesačuvani podaci i lokalni prilozi biće uklonjeni sa ovog uređaja. Sačuvane garancije i fajlovi na Drive-u neće biti obrisani.')) return;
                    await service.discardDraft({userId:user.uid,id:d.id,operationId:d.operationId,expected});
                    disposed.current = true; mounted.current = false;
                    for (const url of pendingUrls.current) URL.revokeObjectURL(url);
                    pendingUrls.current.clear(); setPending([]); setAttachments([]);
                    if (cameraInput.current) cameraInput.current.value = '';
                    if (galleryInput.current) galleryInput.current.value = '';
                    onDiscard();
                } catch (error) { if (mounted.current) setError(error.message); }
                finally { discardingRef.current = false; if (mounted.current) setDiscarding(false); }
            };

            if (draftConflict) return <div role="alert" className="bg-white p-6 rounded-2xl border max-w-xl mx-auto"><p>{draftConflictMessage}</p><button type="button" onClick={onCancel} className="mt-4 border rounded-xl px-3 py-2">Nazad</button></div>;

            return (
                <form onSubmit={submit} aria-busy={saving || processing || discarding} className="form-shell gp-form">
                    <div className="form-heading"><p className="section-label">{initial ? 'IZMENA POSTOJEĆE GARANCIJE' : 'NOVI UNOS GARANCIJE'}</p><h1 data-page-heading tabIndex={-1}>{initial ? 'Izmena garancije' : 'Dodaj proizvod'}</h1></div>
                    <p className="text-sm mb-3">Nacrt se čuva na ovom uređaju. Odustani zatvara formu i zadržava nacrt.</p>
                    {sealed && <p role="status">Nastavak započetog čuvanja: podaci su zaključani dok se ishod ne potvrdi. Nedostajuće originale izaberite ponovo.</p>}
                    {error && <p role="alert" className="text-red-700">{error}</p>}
                    <fieldset disabled={saving || discarding} className="space-y-4">
                        {!initial&&<ReceiptQR disabled={saving||processing||discarding||sealed} isCurrent={qrCurrent} onApply={applyQR}/>}
                        {qrNotice&&<p role="status">{qrNotice}</p>}
                        <section className="form-block"><h2>Podaci o proizvodu</h2><div className="form-grid"><label className="block full">Naziv proizvoda
                            <input type="text" required value={form.name} disabled={sealed} onChange={e => change('name', e.target.value)} className="w-full p-3 border rounded-xl" />
                        </label>
                        <label className="block">Kategorija proizvoda<select value={form.category} disabled={sealed} onChange={e=>change('category',e.target.value)} className="w-full min-w-0 p-3 border rounded-xl"><option value="">Izaberi kategoriju</option>{form.category && !PRODUCT_CATEGORIES.includes(form.category) && <option value={form.category}>{form.category} (stara vrednost)</option>}{PRODUCT_CATEGORIES.map(c=><option key={c}>{c}</option>)}</select></label>
                        <label className="block">Prodavnica (opciono)
                            <input type="text" value={form.store} disabled={sealed} onChange={e => change('store', e.target.value)} className="w-full p-3 border rounded-xl" />
                        </label>
                        <div className="grid sm:grid-cols-2 gap-4">
                            <label className="block">Plaćena cena proizvoda<input type="text" inputMode="decimal" value={form.purchasePrice??''} disabled={sealed} onChange={e=>change('purchasePrice',e.target.value)} className="catalog-control"/></label>
                            <label className="block">Valuta<input type="text" maxLength={3} value={form.currency??''} disabled={sealed} onChange={e=>change('currency',e.target.value.toUpperCase())} placeholder="EUR" className="catalog-control"/></label>
                        </div>
                        <label className="block">Broj fiskalnog računa<input type="text" maxLength={200} value={form.invoiceNumber??''} disabled={sealed} onChange={e=>change('invoiceNumber',e.target.value)} className="catalog-control"/></label>
                        <label className="block full">Izvorni QR link<input type="url" value={form.fiscalReceiptUrl??''} disabled={sealed} onChange={e=>change('fiscalReceiptUrl',e.target.value)} className="catalog-control"/></label>
                        <label className="block full">Opis (opciono)
                            <textarea maxLength={150} aria-describedby="description-count" value={form.description} disabled={sealed} onChange={e => change('description', e.target.value)} className="w-full p-3 border rounded-xl" />
                            <span id="description-count" className="text-sm text-slate-500">{form.description.length}/150 karaktera</span>
                        </label>
                        </div></section><section className="form-block"><h2>Trajanje garancije</h2><div className="form-grid">
                            <label>Datum kupovine<input type="date" required max={dateInput()} value={form.purchaseDate} disabled={sealed} onChange={e => change('purchaseDate', e.target.value)} className="w-full p-3 border rounded-xl" /></label>
                            <label>Trajanje (meseci)<input type="number" required min="1" step="1" value={form.baseMonths} disabled={sealed} onChange={e => change('baseMonths', e.target.value)} className="w-full p-3 border rounded-xl" /></label>
                            <label>Produžena garancija (meseci)<input type="number" required min="0" step="1" value={form.extendedMonths} disabled={sealed} onChange={e => change('extendedMonths', e.target.value)} className="w-full p-3 border rounded-xl" /></label>
                        </div>
                        <p role="status" className="bg-slate-50 p-3 rounded-xl">Ističe: {fmtDate(expiry)}</p>
                        </section>
                        {(service?.mode === 'simulated-drive' || !service?.writesEnabled) && <div className="bg-slate-50 p-3 rounded-xl text-sm">
                            {service?.mode === 'simulated-drive' ? 'SIMULACIJA: podaci i slike ostaju u lokalnom demo skladištu i posle osvežavanja. Nema stvarnog Drive-a.' : 'Lokalna priprema: produkcioni upis nije aktiviran.'}
                        </div>}
                        <section className="form-block" id="attachment-section" tabIndex={-1}><h2>Dokumenti i prilozi</h2><div className="space-y-3">
                            <p id="attachment-picker-help" className="text-sm text-slate-600">Slikaj račun kamerom ili dodaj slike iz galerije. Prethodni prilozi ostaju sačuvani.</p>
                            <input ref={cameraInput} type="file" accept="image/*" capture="environment" aria-label="Slika računa iz kamere" disabled={saving || processing} onChange={handleFile} className="hidden" />
                            <input ref={galleryInput} type="file" accept="image/*" multiple aria-label="Slike iz galerije" disabled={saving || processing} onChange={handleFile} className="hidden" />
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                <button type="button" disabled={saving || processing} aria-describedby="attachment-picker-help" onClick={() => cameraInput.current?.click()} className="primary min-h-[48px] w-full px-4 py-3 rounded-xl bg-blue-600 text-white font-bold focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 disabled:opacity-50 disabled:cursor-not-allowed">Slikaj račun</button>
                                <button type="button" disabled={saving || processing} aria-describedby="attachment-picker-help" onClick={() => galleryInput.current?.click()} className="min-h-[48px] w-full px-4 py-3 rounded-xl border border-blue-600 text-blue-700 font-bold focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 disabled:opacity-50 disabled:cursor-not-allowed">Dodaj iz galerije</button>
                            </div>
                        </div>
                        {processing && <p role="status">Obrada fotografija...</p>}
                        <AttachmentList attachments={[...legacy, ...attachments, ...pending]} user={user} onKindChange={sealed ? null : changeKind} />
                        {legacy.length > 0 && <p className="text-sm text-slate-500">Stari inline prilozi ostaju u zapisu. Migracija nije izvršena; sadržaj se i dalje prenosi sa tim zapisom.</p>}
                        {imageError && <p role="alert" className="text-red-700">{imageError}</p>}
                        </section><div className="form-actions">
                            <button type="button" onClick={onCancel} className="flex-1 py-3 border border-slate-300 rounded-xl font-bold text-slate-500">Odustani</button>
                            <button type="submit" disabled={saving || processing} className="primary flex-1 py-3 font-bold disabled:opacity-50">{saving ? 'Čuvanje...' : error ? 'Pokušaj ponovo' : 'Sačuvaj'}</button>
                        </div>
                        <div className="border-t pt-4">
                            <button type="button" onClick={discard} disabled={saving || processing || discarding || sealed} className="w-full min-w-0 min-h-[48px] whitespace-normal break-words px-4 py-3 border border-red-300 text-red-700 rounded-xl font-bold disabled:opacity-50 disabled:cursor-not-allowed">Odbaci nacrt</button>
                        </div>
                    </fieldset>
                </form>
            );
        }

        function Detail({ item, onBack, onEdit, onAddAttachment, onBusy, user }) {
            const exp = calcExp(item.purchaseDate, item.baseMonths, item.extendedMonths);
            const service = window.attachmentService;
            const [deleteError, setDeleteError] = useState('');
            const [deleting,setDeleting]=useState(false), deletingRef=useRef(false), mounted=useRef(true);
            useEffect(()=>{mounted.current=true;return()=>{mounted.current=false;};},[]);
            useEffect(()=>{onBusy?.(deleting);return()=>onBusy?.(false);},[deleting,onBusy]);
            const canDelete = (() => {
                try {
                    if (!service?.assertWriteAllowed) return false;
                    service.assertWriteAllowed(user?.uid);
                    return true;
                } catch { return false; }
            })();
            const del = async () => {
                if(deletingRef.current)return;
                setDeleteError('');
                try {
                    if (!service?.assertWriteAllowed) throw new Error('Servis za upis nije dostupan.');
                    service.assertWriteAllowed(user?.uid);
                    if (!confirm('Obrisati?')) return;
                    service.assertWriteAllowed(user?.uid);
                    deletingRef.current=true;setDeleting(true);
                    const { db, appId, doc, deleteDoc } = window.firebaseDeps;
                    await deleteDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'warranties', item.id));
                    if(mounted.current)onBack();
                } catch (error) {
                    if(mounted.current)setDeleteError('Brisanje nije uspelo. ' + error.message);
                } finally {deletingRef.current=false;if(mounted.current)setDeleting(false);}
            };
            return <section className="page-content">
                <button type="button" className="quiet back-button" disabled={deleting} onClick={onBack}><Icon name="arrow-left"/>Moja evidencija</button>
                {deleteError&&<p role="alert" className="error">{deleteError}</p>}
                <div className="detail-hero"><div className="row spread"><CategoryIcon category={item.category}/><StatusPill days={calcDays(exp)}/></div><span className="section-label">{categoryLabel(item.category)}</span><h1 data-page-heading tabIndex={-1}>{textValue(item.name)||'Bez naziva'}</h1><p className="muted">Vaša garancija, sa svim važnim podacima i dokumentima.</p><div className="row detail-actions"><button type="button" className="primary icon-button" disabled={deleting} onClick={onEdit}><Icon name="settings"/>Izmeni</button><button type="button" className="icon-button" disabled={deleting} onClick={onAddAttachment}><Icon name="plus"/>Dodaj prilog</button></div></div>
                <div className="detail-layout"><section className="panel"><h2>Podaci o proizvodu</h2><dl className="data-grid">{[
                    ['Prodavnica',textValue(item.store)||'Nije uneta'],['Plaćena cena',Number.isSafeInteger(item.purchasePriceMinor)&&item.purchasePriceMinor>=0?priceText(item.purchasePriceMinor)+' '+textValue(item.currency):'Nije uneta'],['Datum kupovine',fmtDate(parseDate(item.purchaseDate))],['Garancija važi do',fmtDate(exp)],['Osnovna garancija',textValue(String(item.baseMonths??''))+' meseci'],['Produžena garancija',String(item.extendedMonths??0)+' meseci'],['Broj računa',textValue(item.invoiceNumber)||'Nije unet'],['Opis',textValue(item.description)||'Nije unet']
                ].map(([label,value])=><div key={label}><dt>{label}</dt><dd>{value}</dd></div>)}</dl>{!exp&&<p role="status" className="notice">Ovaj zapis ima nepotpune ili neispravne podatke. Izmenite ga da biste dobili tačan datum isteka.</p>}
                {(()=>{try{const link=fiscalLink(item.fiscalReceiptUrl);return <a href={link.url} target="_blank" rel="noopener noreferrer" className="catalog-button inline-block detail-actions">Otvori fiskalni račun</a>;}catch{return null;}})()}</section>
                <section className="panel"><div className="row spread"><h2>Dokumenti</h2><span className="demo-badge">{legacyAttachments(item).length+attachmentRefs(item).length} priloga</span></div><AttachmentList attachments={[...legacyAttachments(item),...attachmentRefs(item)]} user={user}/>{legacyAttachments(item).length>0&&<p className="small muted">Stari inline prilozi su već deo učitanog zapisa; nisu migrirani.</p>}</section></div>
                <div className="row detail-actions"><button type="button" className="danger icon-button" aria-label="Obriši garanciju" disabled={!canDelete||deleting} onClick={del}><Icon name="trash-2"/>{deleting?'Brisanje...':'Obriši garanciju'}</button></div>
            </section>;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
