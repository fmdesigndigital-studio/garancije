            [["path",{"d":"M34 10H37Q41 10 40 16L39 20Q38 24 33 24"}],["rect",{"x":19,"y":3,"width":11,"height":3,"rx":1.2,"fill":"#fff"}],["path",{"d":"M16 6H32Q35 6 34 9L31 29H18L14 9Q13 6 16 6Z","fill":"#fff"}],["path",{"d":"M22 11V25M27 11V25","stroke":"#1261e8"}],["path",{"d":"M18 29H31Q33 29 34 33L36 41Q37 44 33 44H15Q12 44 13 41L15 32Q15 29 18 29Z","fill":"#fff"}],["circle",{"cx":24.5,"cy":36.5,"r":2.8,"stroke":"#1261e8"}]], // Blender

            [["rect",{"x":10,"y":6,"width":28,"height":28,"rx":7,"fill":"#fff"}],["path",{"d":"M9 38V43H12L13 38M35 38L36 43H39V38","fill":"#fff"}],["path",{"d":"M10 20Q5 20 5 25V34Q5 38 10 38H38Q43 38 43 34V25Q43 20 38 20Q34 20 34 25V30H14V25Q14 20 10 20Z","fill":"#fff"}],["rect",{"x":13,"y":29,"width":22,"height":5,"rx":1.2,"fill":"#fff","stroke":"#1261e8"}]], // Fotelja
            [["rect",{"x":10,"y":10,"width":11,"height":11,"rx":1.8,"fill":"#fff"}],["rect",{"x":27,"y":10,"width":11,"height":11,"rx":1.8,"fill":"#dbeafe","stroke":"#1261e8"}],["rect",{"x":10,"y":27,"width":11,"height":11,"rx":1.8,"fill":"#fff"}],["rect",{"x":27,"y":27,"width":11,"height":11,"rx":1.8,"fill":"#fff"}]] // Četiri kvadrata

        function CategoryIcon({category}) {
            const shapes=CATEGORY_ICON_ART[PRODUCT_CATEGORIES.indexOf(category)]||CATEGORY_ICON_ART[12];
            return <span className="category-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" stroke="#14345f" style={{strokeWidth:2.4}} strokeLinecap="round" strokeLinejoin="round" aria-hidden="true" focusable="false">{shapes.map(([tag,attrs],key)=>React.createElement(tag,{...attrs,key}))}</svg></span>;
        }
        function StatusPill({days}) {return <span className={'status '+(days===null?'unknown':days<0?'expired':days<=30?'soon':'')}>{days!==null&&days>30&&<Icon name="check"/>}{getStyle(days).l}</span>;}

        function AppFooter() {
            return <footer className="app-footer">
                <p>GarancijePro · Lična evidencija računa i garancija</p>
                <p>© {new Date().getFullYear()} FM DESIGN DIGITAL STUDIO · Verzija {RELEASE_VERSION}</p>
                <div className="nature-note"><span className="nature-icon"><svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M20 4C10 2 3 7 5 15c3 8 16 3 15-11Z"/><path d="M5 21 16 9M10 16v-5"/></svg></span><span>Korišćenjem digitalnih izdanja čuvamo prirodu</span></div>
            </footer>;
        }
        function Catalog({records,user,listState,onRetry,onOpen}) {
            const [search,setSearch]=useState('');
            const [filters,setFilters]=useState(blankFilters);
            const [sort,setSort]=useState('newest');
            const [showFilters,setShowFilters]=useState(false);
            const [mode,setMode]=useState(()=>{try {const v=window.localStorage.getItem('garancije-view-v1:'+user.uid);return ['cards','list','detailed'].includes(v)?v:'cards';}catch{return 'cards';}});
            const changeMode=value=>{setMode(value);try{window.localStorage.setItem('garancije-view-v1:'+user.uid,value);}catch{}};
            const changeFilter=(key,value)=>setFilters(old=>({...old,[key]:value}));
            const all=records.filter(w=>w.id!=='gp-live-integration-test-001');
            const legacy=[...new Set(all.map(w=>textValue(w.category)).filter(c=>c.trim()&&!PRODUCT_CATEGORIES.includes(c)))].sort();
            const stores=[...new Map(all.filter(w=>storeKey(w.store)).map(w=>[storeKey(w.store),textValue(w.store).replace(/\s+/g,' ').trim()])).entries()].sort((a,b)=>a[1].localeCompare(b[1],'sr'));
            const invalidRange=!!((filters.from&&!parseDate(filters.from))||(filters.to&&!parseDate(filters.to))||(filters.from&&filters.to&&filters.from>filters.to));
            const rows=invalidRange?[]:catalogRows(all,search,filters,sort);
            const active=[filters.category&&'Kategorija: '+filters.category,filters.status&&'Status: '+({valid:'Važeće',soon:'Uskoro ističu',expired:'Istekle'}[filters.status]),filters.store&&'Prodavnica: '+(stores.find(s=>s[0]===filters.store)?.[1]||filters.store),filters.from&&'Od: '+filters.from,filters.to&&'Do: '+filters.to].filter(Boolean);
            return <section className="catalog" aria-labelledby="catalog-title">
                <div className="section-heading"><h2 id="catalog-title" data-page-heading tabIndex={-1}>Moja evidencija</h2><p className="muted">Sačuvajte mir. Pratite ono što vam je važno.</p></div>
                <label className="search-label" htmlFor="catalog-search">Pretraži proizvode, prodavnice i opise</label>
                <div className="search-box"><Icon name="search"/><input id="catalog-search" type="search" value={search} placeholder="Šta tražite?" onChange={e=>setSearch(e.target.value)}/><button type="button" aria-label="Obriši pretragu" disabled={!search} onClick={()=>setSearch('')}><Icon name="x"/></button></div>
                <div className="toolbar">
                    <button type="button" aria-expanded={showFilters} aria-controls="catalog-filters" onClick={()=>setShowFilters(v=>!v)} className="icon-button"><Icon name="sliders-horizontal"/>Filteri{active.length?' ('+active.length+')':''}</button>
                    <label>Sortiraj<select value={sort} onChange={e=>setSort(e.target.value)}><option value="newest">Najnovije dodato</option><option value="oldest">Najstarije dodato</option><option value="name-asc">Naziv A–Z</option><option value="name-desc">Naziv Z–A</option><option value="expiry">Garancija najpre ističe</option><option value="purchase-new">Datum kupovine: novije prvo</option><option value="purchase-old">Datum kupovine: starije prvo</option></select></label>
                    <label>Prikaz<select value={mode} onChange={e=>changeMode(e.target.value)}><option value="cards">Kartice</option><option value="list">Lista</option><option value="detailed">Detaljno</option></select></label>
                </div>
                <div id="catalog-filters" hidden={!showFilters} className="filters">
                    <label>Kategorija<select value={filters.category} onChange={e=>changeFilter('category',e.target.value)}><option value="">Sve kategorije</option>{PRODUCT_CATEGORIES.map(c=><option key={c}>{c}</option>)}{legacy.map(c=><option key={c} value={c}>{c} (stara vrednost)</option>)}<option>Nerazvrstano</option></select></label>
                    <label>Status<select value={filters.status} onChange={e=>changeFilter('status',e.target.value)}><option value="">Svi statusi</option><option value="valid">Važeće</option><option value="soon">Uskoro ističu</option><option value="expired">Istekle</option></select></label>
                    <label>Prodavnica<select value={filters.store} onChange={e=>changeFilter('store',e.target.value)}><option value="">Sve prodavnice</option>{stores.map(([key,label])=><option key={key} value={key}>{label}</option>)}</select></label>
                    <label>Datum kupovine od<input type="date" value={filters.from} onChange={e=>changeFilter('from',e.target.value)}/></label>
                    <label>Datum kupovine do<input type="date" value={filters.to} onChange={e=>changeFilter('to',e.target.value)}/></label>
                </div>
                {invalidRange&&<p role="alert" className="error">Proverite raspon datuma: početni datum mora biti pre ili jednak krajnjem.</p>}
                <div className="quick-status" aria-label="Brzi filteri statusa">{[['','Sve',all.length],['valid','Važeće',all.filter(w=>{const d=calcDays(calcExp(w.purchaseDate,w.baseMonths,w.extendedMonths));return d!==null&&d>=0;}).length],['soon','Uskoro ističu',all.filter(w=>{const d=calcDays(calcExp(w.purchaseDate,w.baseMonths,w.extendedMonths));return d!==null&&d>=0&&d<=30;}).length],['expired','Istekle',all.filter(w=>{const d=calcDays(calcExp(w.purchaseDate,w.baseMonths,w.extendedMonths));return d!==null&&d<0;}).length]].map(([value,label,count])=><button type="button" key={value} aria-pressed={filters.status===value} onClick={()=>changeFilter('status',value)}>{label} <span className="count">{count}</span></button>)}</div>
                {active.length>0&&<ul className="active-filters" aria-label="Aktivni filteri">{active.map(t=><li className="active-filter" key={t}>{t}</li>)}</ul>}
                <div className="results-line"><p role="status">Prikazano <strong>{listState==='ready'?rows.length:0}</strong> od {all.length} proizvoda</p><button type="button" onClick={()=>{setFilters(blankFilters());setSearch('');setSort('newest');}}>Poništi filtere</button></div>
                {listState==='loading'&&<p role="status">Učitavanje garancija...</p>}
                {listState==='error'&&<div role="alert" className="error">Garancije nisu učitane. <button type="button" onClick={onRetry}>Pokušaj ponovo</button></div>}
                {listState==='ready'&&!rows.length&&<div className="empty-state"><Icon name="search"/><h3>{all.length?'Nema rezultata':'Još nema garancija'}</h3><p className="muted">{all.length?'Probajte drugi naziv ili poništite filtere. Vaša evidencija je sačuvana.':'Dodajte prvu garanciju dugmetom Dodaj proizvod.'}</p></div>}
                {mode==='detailed'?<table className="details-table" role="table" aria-label="Detaljni pregled garancija"><thead role="rowgroup"><tr role="row">{['Proizvod','Kategorija','Prodavnica','Kupljeno','Ističe','Status','Opis','Prilozi'].map(h=><th role="columnheader" scope="col" key={h}>{h}</th>)}</tr></thead><tbody role="rowgroup">{(listState==='ready'?rows:[]).map(({w,exp,days})=><tr role="row" key={w.id}>{[
                    ['Proizvod',<button type="button" className="catalog-open" onClick={()=>onOpen(w)}>{textValue(w.name)||'Bez naziva'}</button>],['Kategorija',categoryLabel(w.category)],['Prodavnica',textValue(w.store)||'—'],['Kupljeno',fmtDate(parseDate(w.purchaseDate))],['Ističe',fmtDate(exp)],['Status',getStyle(days).l],['Opis',textValue(w.description)||'—'],['Prilozi',legacyAttachments(w).length+attachmentRefs(w).length]
                ].map(([label,value])=><td role="cell" key={label}><span className="catalog-cell-label">{label}: </span>{value}</td>)}</tr>)}</tbody></table>:
                <div className={mode==='cards'?'products-grid':'products-list'}>{(listState==='ready'?rows:[]).map(({w,exp,days})=> mode==='list'?
                    <button type="button" key={w.id} onClick={()=>onOpen(w)} className="product-list-link"><CategoryIcon category={w.category}/><span><strong className="list-name">{textValue(w.name)||'Bez naziva'}</strong><span className="list-meta"><span>{categoryLabel(w.category)}</span><span>Ističe: {fmtDate(exp)}</span></span></span><StatusPill days={days}/></button>:
                    <article className="product-card" key={w.id}><button type="button" onClick={()=>onOpen(w)} className="product-link"><span className="product-top"><CategoryIcon category={w.category}/><StatusPill days={days}/></span><span><span className="product-category">{categoryLabel(w.category)}</span><strong className="product-name">{textValue(w.name)||'Bez naziva'}</strong></span><span className="product-bottom"><span>Garancija važi do<strong>{fmtDate(exp)}</strong></span><span className="arrow"><Icon name="chevron-right"/></span></span></button></article>
                )}</div>}
            </section>;
        }

        function App() {
            const [warranties, setWarranties] = useState([]);
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [view, setView] = useState('list');
            const [selected, setSelected] = useState(null);
            const [search, setSearch] = useState('');
            const [listState, setListState] = useState('loading');
            const [retry, setRetry] = useState(0);
            const [authError, setAuthError] = useState('');
            const [formBusy, setFormBusy] = useState(false);
            const [notice, setNotice] = useState('');
            const [attachmentSection, setAttachmentSection] = useState(false);
            const mainRef = useRef(null);
            const headingInputMode = useRef('automatic');
            useEffect(() => {
                const markHeadingInput = event => {
                    headingInputMode.current = event.type === 'keydown' ? 'keyboard' : 'pointer';
                    const heading = document.activeElement;
                    if (heading?.matches('.hero h1[data-page-heading]')) heading.dataset.headingFocus = headingInputMode.current;
                };
                document.addEventListener('keydown', markHeadingInput, true);
                document.addEventListener('pointerdown', markHeadingInput, true);
                return () => {
                    document.removeEventListener('keydown', markHeadingInput, true);
                    document.removeEventListener('pointerdown', markHeadingInput, true);
                };
            }, []);
            const finishNavigation = next => { setView(next); setAttachmentSection(false); };
            const navigate = next => { if (!formBusy) finishNavigation(next); };
            useEffect(() => {
                const frame=requestAnimationFrame(()=>{
                    const target=attachmentSection?mainRef.current?.querySelector('#attachment-section'):[...(mainRef.current?.querySelectorAll('[data-page-heading]')||[])].find(el=>el.getClientRects().length);
                    if(target){
                        if(target.matches('.hero h1[data-page-heading]')) target.dataset.headingFocus=headingInputMode.current;
                        target.focus({preventScroll:true});target.scrollIntoView({block:'start'});
                    }
                });
                return()=>cancelAnimationFrame(frame);
            },[view,user?.uid,attachmentSection]);

            useEffect(() => {
                let unsubscribe, active = true;
                setLoading(true); setAuthError('');
                const fail = () => { if (active) { setAuthError('Povezivanje nije uspelo. Pokušajte ponovo.'); setLoading(false); } };
                const connect = () => {
                    if (!window.firebaseDeps) return;
                    clearInterval(timer); clearTimeout(timeout);
                    try {
                        unsubscribe = window.firebaseDeps.onAuthStateChanged(window.firebaseDeps.auth, u => {
                            if (!active) return;
                            void window.attachmentService.authChanged?.(u);
                            setUser(u); setWarranties([]); setSelected(null); setView('list'); setLoading(false);
                        }, fail);
                    } catch { fail(); }
                };
                const timer = setInterval(connect, 100);
                const timeout = setTimeout(() => { clearInterval(timer); fail(); }, 10000);
                connect();
                return () => { active = false; clearInterval(timer); clearTimeout(timeout); if (unsubscribe) unsubscribe(); };
            }, [retry]);

            useEffect(() => {
                if (!user || !window.firebaseDeps) return;
                let active = true, unsubscribe;
                setListState('loading');
                const { db, appId, collection, onSnapshot } = window.firebaseDeps;
                const fail = () => { if (active) setListState('error'); };
                try {
                    unsubscribe = onSnapshot(collection(db, 'artifacts', appId, 'users', user.uid, 'warranties'), snapshot => {
                        if (!active) return;
                        setWarranties(snapshot.docs.map(d => ({ ...d.data(), id: d.id })).filter(w => w.id !== 'gp-live-integration-test-001'));
                        setListState('ready');
                    }, fail);
                } catch { fail(); }
                return () => { active = false; if (unsubscribe) unsubscribe(); };
            }, [user, retry]);

            const openForm = (record=null,focusAttachments=false) => {
                if(formBusy)return;
                try { const d=window.attachmentService.getDraft(user.uid);
                    if(record){record=warranties.find(w=>w.id===record.id)||record;if(record._attachmentDeletion)throw Error('Prvo razrešite započeto brisanje ove garancije.');}
                    if (record && !draftMatchesRecord(d, record)) throw new Error(draftConflictMessage);
                    setAuthError(''); setAttachmentSection(focusAttachments);
                    if(d) { setSelected(d.edit ? (warranties.find(w=>w.id===d.id)||{id:d.id}) : null); setView(d.edit?'edit':'add'); }
                    else {setSelected(record);setView(record?'edit':'add');}
                } catch(e) {setAuthError(e.message);}
            };
            const login = async () => {
                try { setAuthError(''); await window.firebaseDeps.signInWithPopup(window.firebaseDeps.auth, window.firebaseDeps.provider); }
                catch { setAuthError('Prijava nije uspela. Pokušajte ponovo.'); }
            };
            const logout = async () => {
                try { window.attachmentService.disconnect(); await window.firebaseDeps.signOut(window.firebaseDeps.auth); }
                catch { setAuthError('Odjava nije uspela. Pokušajte ponovo.'); }
            };

            if (loading) return <div role="status" className="min-h-screen flex items-center justify-center">Učitavanje...</div>;
            if (authError && !window.firebaseDeps) return <div role="alert" className="p-6">{authError} <button onClick={() => setRetry(r => r + 1)}>Pokušaj ponovo</button></div>;

            if (!user) return (
                <div className="min-h-screen flex items-center justify-center p-6 bg-slate-100">
                    <div className="bg-white p-8 rounded-2xl shadow-xl text-center max-w-sm w-full">
                        <Icon name="shield-check" className="w-12 h-12 text-blue-600 mx-auto mb-4" />
                        <h1 className="text-2xl font-bold mb-6">GarancijePro</h1>
                        {authError && <p role="alert">{authError} <button onClick={() => setRetry(r => r + 1)}>Pokušaj ponovo</button></p>}
                        <button onClick={login} className="w-full bg-slate-900 text-white py-3 rounded-xl font-bold flex items-center justify-center gap-2">
                            <Icon name="log-in" className="w-5 h-5" /> Prijavi se Google-om
                        </button>
                    </div>
                </div>
            );

            return <div className="gp-app">
                <a href="#app-main" className="skip-link">Pređi na sadržaj</a>
                <header className="app-header"><div className="gp-container header-inner">
                    <button type="button" className="brand quiet" disabled={formBusy} onClick={()=>navigate('list')}><span className="brand-mark"><Icon name="shield-check"/></span><span>GarancijePro</span></button>
                    <div className="header-right"><button type="button" aria-label="Podešavanja" disabled={formBusy} onClick={()=>navigate('settings')}><Icon name="settings"/></button></div>
                </div></header>
                <main className="gp-container" id="app-main" ref={mainRef} tabIndex={-1}>
                    {notice&&<p role="status" className="toast">{notice}</p>}{authError&&<p role="alert" className="error">{authError}</p>}
                    {view!=='list'&&view!=='settings'&&<div className="context-drive"><DriveConnection compact/></div>}
                    <div hidden={view!=='list'}>
                        <section className="hero"><p className="section-label">VAŠA DIGITALNA EVIDENCIJA</p><h1 data-page-heading tabIndex={-1}>Računi i garancije</h1><p>Uredno složeni i uvek pri ruci. Više reda, manje traženja.</p><button type="button" className="primary icon-button" disabled={formBusy} onClick={()=>openForm()}><Icon name="plus"/>Dodaj proizvod</button></section>
                        {view==='list'&&<><DeletionRecovery records={warranties} user={user} onOpen={w=>{setSelected(w);navigate('detail');}}/><DriveConnection compact/><LocalPhotoCleanup user={user} onComplete={()=>setNotice('Lokalne kopije završenog nacrta su uklonjene.')}/></>}
                        <button type="button" className="resume-draft" disabled={formBusy} onClick={()=>openForm()}>Nastavi nacrt / novi unos</button>
                        <Catalog key={user.uid} records={warranties} user={user} listState={listState} onRetry={()=>setRetry(r=>r+1)} onOpen={w=>{setSelected(w);navigate('detail');}}/>

                finally { discardingRef.current = false; if (mounted.current) setDiscarding(false); }
            };

            if (draftConflict) return <div role="alert" className="bg-white p-6 rounded-2xl border max-w-xl mx-auto"><p>{draftConflictMessage}</p><button type="button" onClick={onCancel} className="mt-4 border rounded-xl px-3 py-2">Nazad</button></div>;

            return (
                <form onSubmit={submit} aria-busy={saving || processing || discarding} className="form-shell gp-form">
                    {documentFile&&<DocumentEditor file={documentFile} onConfirm={confirmDocument} onCancel={closeDocument}/>}
                    <div className="form-heading"><p className="section-label">{initial ? 'IZMENA POSTOJEĆE GARANCIJE' : 'NOVI UNOS GARANCIJE'}</p><h1 data-page-heading tabIndex={-1}>{initial ? 'Izmena garancije' : 'Dodaj proizvod'}</h1></div>
                    <p className="text-sm mb-3">Nacrt se čuva na ovom uređaju. Odustani zatvara formu i zadržava nacrt.</p>
                    {sealed && <p role="status">Nastavak započetog čuvanja: podaci su zaključani dok se ishod ne potvrdi. Nedostajuće originale izaberite ponovo.</p>}
                    {error && <p role="alert" className="text-red-700">{error}</p>}
                    {staging&&!saving&&<p role="status">Čuvam lokalni nacrt…</p>}
                    {stale&&<section ref={recoveryPanel} tabIndex={-1} className="notice" aria-label="Zastarela kartica"><h2>Nacrt je promenjen u drugoj kartici</h2><p>Ove prikazane izmene nisu prepisale aktuelni nacrt. Nastavite u aktuelnoj kartici ili izričito učitajte njene podatke.</p><button type="button" disabled={resolving} onClick={reloadDraft}>Učitaj aktuelni nacrt</button><button type="button" disabled={resolving} onClick={()=>{if(window.confirm('Zatvori zastareli prikaz? Neupisane izmene ove kartice biće napuštene; aktuelni nacrt ostaje.'))onCancel();}}>Zatvori zastareli prikaz</button></section>}
                    {safeConflict&&!conflict&&!stale&&<section className="notice"><p>Potvrđen je konflikt pre spoljnog upisa. Lokalni unos i novi prilozi su očuvani.</p><button type="button" disabled={resolving||saving} onClick={inspectConflict}>Pregledaj konflikt</button></section>}
                    {conflict&&!stale&&<section ref={recoveryPanel} tabIndex={-1} className="notice" aria-label="Razrešenje konflikta"><h2>Pregled razlika</h2><p>Ništa još nije prepisano. Novi lokalni prilozi ostaju uz nacrt. Razrešenje ne šalje podatke na Drive ili u evidenciju; nakon pregleda ponovo birate Sačuvaj.</p>{conflict.reason&&<p>{conflict.reason}</p>}
                        {conflict.canRebase&&conflict.fields.map(row=><div key={row.key}><strong>{row.label}</strong><p>Moj unos: {conflictValue(row.key,row.local)}</p><p>Noviji zapis: {conflictValue(row.key,row.current)}</p>{row.conflict?<label>Vrednost za {row.label}<select disabled={resolving} value={choices[row.key]||''} onChange={e=>setChoices(old=>({...old,[row.key]:e.target.value}))}><option value="">Izaberite vrednost</option><option value="local">Zadrži moj unos</option><option value="current">Preuzmi iz novijeg zapisa</option></select></label>:<p>Izmene ovog polja mogu bezbedno da se usklade.</p>}</div>)}
                        <div className="row">{conflict.canRebase&&<button type="button" disabled={resolving||conflict.fields.some(f=>f.conflict&&!choices[f.key])} onClick={()=>resolveConflict(false)}>Primeni razrešenje u nacrtu</button>}<button type="button" disabled={resolving} onClick={inspectConflict}>Osveži pregled konflikta</button><button type="button" disabled={resolving} onClick={()=>{conflictRef.current=null;setConflict(null);}}>Zadrži nacrt bez razrešenja</button><button type="button" disabled={resolving} onClick={()=>resolveConflict(true)}>Odbaci samo ovaj lokalni nacrt</button></div>
                    </section>}
                    <fieldset disabled={saving || discarding || resolving || stale || !!conflict} className="space-y-4">
                        {!initial&&<ReceiptQR disabled={saving||processing||discarding||sealed} isCurrent={qrCurrent} onApply={applyQR}/>}
                        {qrNotice&&<p role="status">{qrNotice}</p>}
                        <section className="form-block"><h2>Podaci o proizvodu</h2><div className="form-grid"><label className="block full">Naziv proizvoda
                            <input type="text" required value={form.name} disabled={sealed} onChange={e => change('name', e.target.value)} className="w-full p-3 border rounded-xl" />
                        </label>
                        <label className="block">Kategorija proizvoda<select value={form.category} disabled={sealed} onChange={e=>change('category',e.target.value)} className="w-full min-w-0 p-3 border rounded-xl"><option value="">Izaberi kategoriju</option>{form.category && !PRODUCT_CATEGORIES.includes(form.category) && <option value={form.category}>{form.category} (stara vrednost)</option>}{PRODUCT_CATEGORIES.map(c=><option key={c}>{c}</option>)}</select></label>
                        <label className="block">Prodavnica (opciono)
                            <input type="text" value={form.store} disabled={sealed} onChange={e => change('store', e.target.value)} className="w-full p-3 border rounded-xl" />
                        </label>
                        <div className="grid sm:grid-cols-2 gap-4">
                            <label className="block">Plaćena cena proizvoda<input type="text" inputMode="decimal" value={form.purchasePrice??''} disabled={sealed} onChange={e=>change('purchasePrice',e.target.value)} className="catalog-control"/></label>
                            <label className="block">Valuta<input type="text" maxLength={3} value={form.currency??''} disabled={sealed} onChange={e=>change('currency',e.target.value.toUpperCase())} placeholder="EUR" className="catalog-control"/></label>
                        </div>
                        <label className="block">Broj fiskalnog računa<input type="text" maxLength={200} value={form.invoiceNumber??''} disabled={sealed} onChange={e=>change('invoiceNumber',e.target.value)} className="catalog-control"/></label>
                        <label className="block full">Izvorni QR link<input type="url" value={form.fiscalReceiptUrl??''} disabled={sealed} onChange={e=>change('fiscalReceiptUrl',e.target.value)} className="catalog-control"/></label>
                        <label className="block full">Opis (opciono)
                            <textarea maxLength={150} aria-describedby="description-count" value={form.description} disabled={sealed} onChange={e => change('description', e.target.value)} className="w-full p-3 border rounded-xl" />
                            <span id="description-count" className="text-sm text-slate-500">{form.description.length}/150 karaktera</span>
                        </label>
                        </div></section><section className="form-block"><h2>Trajanje garancije</h2><div className="form-grid">
                            <label>Datum kupovine<input type="date" required max={dateInput()} value={form.purchaseDate} disabled={sealed} onChange={e => change('purchaseDate', e.target.value)} className="w-full p-3 border rounded-xl" /></label>
                            <label>Trajanje (meseci)<input type="number" required min="1" step="1" value={form.baseMonths} disabled={sealed} onChange={e => change('baseMonths', e.target.value)} className="w-full p-3 border rounded-xl" /></label>
                            <label>Produžena garancija (meseci)<input type="number" required min="0" step="1" value={form.extendedMonths} disabled={sealed} onChange={e => change('extendedMonths', e.target.value)} className="w-full p-3 border rounded-xl" /></label>
                        </div>
                        <p role="status" className="bg-slate-50 p-3 rounded-xl">Ističe: {fmtDate(expiry)}</p>
                        </section>
                        {(service?.mode === 'simulated-drive' || !service?.writesEnabled) && <div className="bg-slate-50 p-3 rounded-xl text-sm">
                            {service?.mode === 'simulated-drive' ? 'SIMULACIJA: podaci i slike ostaju u lokalnom demo skladištu i posle osvežavanja. Nema stvarnog Drive-a.' : 'Lokalna priprema: produkcioni upis nije aktiviran.'}
                        </div>}
                        <section className="form-block" id="attachment-section" tabIndex={-1}><h2>Dokumenti i prilozi</h2><div className="space-y-3">
                            <p id="attachment-picker-help" className="text-sm text-slate-600">Fotografija iz kamere otvara režim Dokumenti sa ručnim uglovima. Galerija dodaje originalne slike. Prethodni prilozi ostaju sačuvani.</p>
                            <input ref={cameraInput} type="file" accept="image/*" capture="environment" aria-label="Fotografija dokumenta iz kamere" disabled={saving || processing || staging || sealed} onChange={handleCamera} className="hidden" />
                            <input ref={galleryInput} type="file" accept="image/*" multiple aria-label="Slike iz galerije" disabled={saving || processing || staging} onChange={handleFile} className="hidden" />
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                <button type="button" disabled={saving || processing || staging || sealed} aria-describedby="attachment-picker-help" onClick={() => cameraInput.current?.click()} className="primary min-h-[48px] w-full px-4 py-3 rounded-xl bg-blue-600 text-white font-bold focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 disabled:opacity-50 disabled:cursor-not-allowed">Slikaj dokument</button>
                                <button type="button" disabled={saving || processing || staging} aria-describedby="attachment-picker-help" onClick={() => galleryInput.current?.click()} className="min-h-[48px] w-full px-4 py-3 rounded-xl border border-blue-600 text-blue-700 font-bold focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 disabled:opacity-50 disabled:cursor-not-allowed">Dodaj iz galerije</button>
                            </div>
                        </div>
                        {processing && <p role="status">Obrada fotografija...</p>}
                        <AttachmentList attachments={[...legacy, ...attachments, ...pending]} user={user} onKindChange={sealed ? null : changeKind} pendingIds={pending.map(a=>a.id)} onNameChange={sealed?null:changePendingName} />
                        {legacy.length > 0 && <p className="text-sm text-slate-500">Stari inline prilozi ostaju u zapisu. Migracija nije izvršena; sadržaj se i dalje prenosi sa tim zapisom.</p>}
                        {imageError && <p role="alert" className="text-red-700">{imageError}</p>}
                        </section><div className="form-actions">
                            <button type="button" disabled={saving||processing||discarding||staging} onClick={onCancel} className="flex-1 py-3 border border-slate-300 rounded-xl font-bold text-slate-500">Odustani</button>
                            <button type="submit" disabled={saving || processing} className="primary flex-1 py-3 font-bold disabled:opacity-50">{saving ? 'Čuvanje...' : error ? 'Pokušaj ponovo' : 'Sačuvaj'}</button>
                        </div>
                        <div className="border-t pt-4">
                            <button type="button" onClick={discard} disabled={saving || processing || staging || discarding || sealed} className="w-full min-w-0 min-h-[48px] whitespace-normal break-words px-4 py-3 border border-red-300 text-red-700 rounded-xl font-bold disabled:opacity-50 disabled:cursor-not-allowed">Odbaci nacrt</button>
                        </div>
                    </fieldset>
                </form>
            );
        }


        function WarrantyDelete({item,user,onClose,onDeleted}) {
            const service=window.attachmentService,dialog=useRef(null),life=useRef({active:true,seq:0,running:false});
            const [mode,setMode]=useState(null),[plan,setPlan]=useState(null),[loading,setLoading]=useState(true),[running,setRunning]=useState(false),[error,setError]=useState(''),[ack,setAck]=useState(false),[retry,setRetry]=useState(0),[,refresh]=useState(0);
            const driveState=service.getStatus().state;
            useEffect(()=>service.subscribe(()=>refresh(n=>n+1)),[service]);
            useEffect(()=>{life.current.active=true;const previous=document.activeElement;dialog.current?.showModal();return()=>{life.current.active=false;life.current.seq++;dialog.current?.close();previous?.focus?.();};},[]);
            useEffect(()=>{
                if(life.current.running)return;
                const seq=++life.current.seq;setLoading(true);setPlan(null);setAck(false);
                service.prepareDeletion({userId:user.uid,id:item.id,mode}).then(value=>{
                    if(!life.current.active||seq!==life.current.seq)return;
                    if(value.absent){onDeleted('Zapis više ne postoji. Nema novih Drive zahteva.');return;}setPlan(value);
                }).catch(e=>{if(life.current.active&&seq===life.current.seq)setError(e.message);}).finally(()=>{if(life.current.active&&seq===life.current.seq)setLoading(false);});
                return()=>{life.current.seq++;};
            },[item.id,user.uid,mode,driveState,retry]);
            const close=()=>{if(!life.current.running)onClose();};
            const confirmDelete=async()=>{
                if(life.current.running||loading||!plan)return;life.current.running=true;setRunning(true);setError('');
                try{
                    await service.executeDeletion({userId:user.uid,plan,acknowledgeUncertain:ack});
                    service.assertWriteAllowed(user.uid);
                    if(life.current.active)onDeleted(plan.mode==='trash'?'Garancija je obrisana. Samo potvrđeni prilozi su premešteni u Drive korpu; izuzeti fajlovi ostaju.':'Zapis je obrisan. Nema novih premeštanja Drive fajlova.');
                }catch(e){if(life.current.active){setError('Brisanje nije završeno. '+e.message);setRetry(n=>n+1);}}
                finally{life.current.running=false;if(life.current.active)setRunning(false);}
            };
            const chosen=mode||plan?.mode||'app-only';
            return <dialog ref={dialog} className="warranty-delete" aria-labelledby="warranty-delete-title" onCancel={e=>{e.preventDefault();close();}}>
                <div className="modal-header"><h2 id="warranty-delete-title">Obriši garanciju</h2><button type="button" aria-label="Zatvori pregled brisanja" disabled={running} onClick={close}>×</button></div>
                <div className="modal-body">
                    <p><strong>{plan?.name||textValue(item.name)||'Garancija'}</strong></p>
                    {plan?.resume&&<p className="notice">Operacija je već započeta. Potvrđeni fajlovi ostaju u korpi; nastavak proverava iste ID-eve. Promena na „samo zapis“ ne vraća ranije premeštene fajlove.</p>}
                    <fieldset disabled={running}>
                        <legend>Izaberi obim brisanja</legend>
                        <label><input type="radio" name="warranty-delete-mode" checked={chosen==='app-only'} onChange={()=>{setError('');setMode('app-only');}}/>Obriši samo zapis iz aplikacije — bez novih promena na Drive-u</label>
                        <label><input type="radio" name="warranty-delete-mode" checked={chosen==='trash'} onChange={()=>{setError('');setMode('trash');}}/>Obriši zapis i premesti proverene priloge u Drive korpu</label>
                    </fieldset>
                    {(chosen==='trash'||plan?.resume)&&<DriveConnection compact/>}
                    {loading&&<p role="status">Proveravam zapis, reference i dostupnost priloga…</p>}
                    {plan&&<ul className="deletion-files" aria-label="Tačan spisak priloga">{plan.operation.files.map(f=><li key={f.key}><strong>{f.name}</strong>{f.count>1&&<span> · {f.count} referenci, jedan fajl</span>}<p>{f.reason}</p></li>)}</ul>}
                    {plan&&!plan.operation.files.length&&<p>Nema zasebnih priloga za ovu operaciju.</p>}
                    <p className="notice">Drive trajno briše fajlove iz korpe posle 30 dana, ili ranije ako ručno isprazniš korpu. Do tada zauzimaju prostor. Vraćanje fajla iz Drive korpe ne vraća obrisanu garanciju u aplikaciju.</p>
                    {plan?.needsAcknowledgement&&<label><input type="checkbox" checked={ack} disabled={running} onChange={e=>setAck(e.target.checked)}/>Razumem da prethodni zahtev ima neizvestan ishod. Taj fajl neće dobiti novi zahtev; brisanje zapisa uklanja njegovu referencu, bez tvrdnje da je fajl obrisan ili sačuvan.</label>}
                    {error&&<p role="alert" className="error">{error}</p>}
                    <div className="modal-actions">
                        <button type="button" disabled={running} onClick={close}>Otkaži</button>
                        <button type="button" disabled={running||loading} onClick={()=>{setError('');setRetry(n=>n+1);}}>Osveži proveru</button>
                        <button type="button" className="danger" disabled={running||loading||!plan||plan.needsAcknowledgement&&!ack} onClick={confirmDelete}>{running?'Brisanje…':plan?.resume?'Potvrdi nastavak':chosen==='trash'?'Premesti proverene fajlove i obriši zapis':'Potvrdi brisanje samo zapisa'}</button>
                    </div>
                </div>
            </dialog>;
        }
        function DeletionRecovery({records,user,onOpen}) {
            const service=window.attachmentService,[,refresh]=useState(0);
            useEffect(()=>service.subscribe(()=>refresh(n=>n+1)),[service]);
            let hints=[];try{hints=service.getDeletionHints(user.uid);}catch{}
            const pending=records.filter(r=>r._attachmentDeletion),known=new Set(pending.map(r=>r.id));
            for(const hint of hints)if(!known.has(hint.id)){pending.push({id:hint.id,name:'Provera nedovršenog brisanja'});known.add(hint.id);}
            return pending.length?<section className="notice" aria-label="Nedovršena brisanja"><p>Brisanje nije potvrđeno kao završeno. Reference su sačuvane do razrešenja; nema automatskog ponavljanja.</p>{pending.map(r=><button type="button" key={r.id} onClick={()=>onOpen(r)}>Nastavi / proveri: {textValue(r.name)||'Garancija'}</button>)}</section>:null;
        }

        function Detail({ item, onBack, onEdit, onAddAttachment, onBusy, user, onDeleted }) {
            const exp = calcExp(item.purchaseDate, item.baseMonths, item.extendedMonths);
            const service = window.attachmentService;
            const [deleteOpen,setDeleteOpen]=useState(false),deleting=deleteOpen;
            useEffect(()=>{onBusy?.(deleting);return()=>onBusy?.(false);},[deleting,onBusy]);
            const canDelete=(()=>{try{service.assertWriteAllowed(user?.uid);return true;}catch{return false;}})();
            const del=()=>{if(canDelete&&!deleteOpen)setDeleteOpen(true);};
            return <section className="page-content">
                <button type="button" className="quiet back-button" disabled={deleting} onClick={onBack}><Icon name="arrow-left"/>Moja evidencija</button>
                {item._attachmentDeletion&&<p role="status" className="notice">Brisanje je započeto. Izmene i novi prilozi su zaustavljeni do razrešenja operacije.</p>}
                {deleteOpen&&<WarrantyDelete item={item} user={user} onClose={()=>setDeleteOpen(false)} onDeleted={message=>{setDeleteOpen(false);if(onDeleted)onDeleted(message);else onBack();}}/>}
                <div className="detail-hero"><div className="row spread"><CategoryIcon category={item.category}/><StatusPill days={calcDays(exp)}/></div><span className="section-label">{categoryLabel(item.category)}</span><h1 data-page-heading tabIndex={-1}>{textValue(item.name)||'Bez naziva'}</h1><p className="muted">Vaša garancija, sa svim važnim podacima i dokumentima.</p><div className="row detail-actions"><button type="button" className="primary icon-button" disabled={deleting||!!item._attachmentDeletion} onClick={onEdit}><Icon name="settings"/>Izmeni</button><button type="button" className="icon-button" disabled={deleting||!!item._attachmentDeletion} onClick={onAddAttachment}><Icon name="plus"/>Dodaj prilog</button></div></div>
                <div className="detail-layout"><section className="panel"><h2>Podaci o proizvodu</h2><dl className="data-grid">{[
                    ['Prodavnica',textValue(item.store)||'Nije uneta'],['Plaćena cena',Number.isSafeInteger(item.purchasePriceMinor)&&item.purchasePriceMinor>=0?priceText(item.purchasePriceMinor)+' '+textValue(item.currency):'Nije uneta'],['Datum kupovine',fmtDate(parseDate(item.purchaseDate))],['Garancija važi do',fmtDate(exp)],['Osnovna garancija',textValue(String(item.baseMonths??''))+' meseci'],['Produžena garancija',String(item.extendedMonths??0)+' meseci'],['Broj računa',textValue(item.invoiceNumber)||'Nije unet'],['Opis',textValue(item.description)||'Nije unet']
                ].map(([label,value])=><div key={label}><dt>{label}</dt><dd>{value}</dd></div>)}</dl>{!exp&&<p role="status" className="notice">Ovaj zapis ima nepotpune ili neispravne podatke. Izmenite ga da biste dobili tačan datum isteka.</p>}
                {(()=>{try{const link=fiscalLink(item.fiscalReceiptUrl);return <a href={link.url} target="_blank" rel="noopener noreferrer" className="catalog-button inline-block detail-actions">Otvori fiskalni račun</a>;}catch{return null;}})()}</section>
                <section className="panel"><div className="row spread"><h2>Dokumenti</h2><span className="demo-badge">{legacyAttachments(item).length+attachmentRefs(item).length} priloga</span></div><AttachmentList attachments={[...legacyAttachments(item),...attachmentRefs(item)]} user={user}/>{legacyAttachments(item).length>0&&<p className="small muted">Stari inline prilozi su već deo učitanog zapisa; nisu migrirani.</p>}</section></div>
                <div className="row detail-actions"><button type="button" className="danger icon-button" aria-label="Obriši garanciju" disabled={!canDelete||deleting} onClick={del}><Icon name="trash-2"/>{deleting?'Pregled brisanja…':item._attachmentDeletion?'Nastavi brisanje':'Obriši garanciju'}</button></div>
            </section>;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
