            const job = await reserve(key), props = { app: 'garancije-pro', operation: key, ...(blob ? { sha256: await sha256(blob) } : {}) };

            const existing = await getFile(job.id); if (existing) { check(existing); mutateJournal(j => { j.jobs[key].state = 'confirmed'; }); return job.id; }

                    }
                } else response = await request(API + '/files', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
                if (!response.ok && response.status !== 409) await json(response);
                check(await getFile(job.id));

            assertWriteAllowed(userId) {
                assertUser(userId);
                if (!options.allowWrites) throw new Error('Produkcioni upis nije aktiviran.');
            },
            subscribe(fn) { listeners.add(fn); return () => listeners.delete(fn); },
            getStatus: () => ({ state, message, account, expiresAt: deadline, simulated: !!options.simulated }),

            getDraft(userId) { assertUser(userId); const d = journal().draft; return d ? structuredClone(d) : null; },
            async discardDraft({userId,id,operationId,expected}) {
                assertUser(userId);

            },
            stageDraft({userId,id,base,metadata,attachments,pending,operationId}) {
                assertUser(userId); let draft;

                    if (operationId && (j.discardedDrafts?.[operationId] || (j.draft && j.draft.operationId !== operationId))) throw new Error('Ovaj nacrt više nije aktivan. Nema automatskog obnavljanja.');

            },
            async checkFolders() {
                const values=await Promise.all(Object.values(DRIVE_FOLDERS).map(folderInfo));

            async saveWarranty({ userId, newAttachments=[] }) {
                api.assertWriteAllowed(userId);
                if(!options.metadataStore?.read || !options.metadataStore?.commit) throw new Error('Cuvanje nije aktivirano. Nacrt je ocuvan.');

        const { useState, useMemo, useEffect, useRef } = React;

        const dateInput = (d = new Date()) => [d.getFullYear(), String(d.getMonth() + 1).padStart(2, '0'), String(d.getDate()).padStart(2, '0')].join('-');

            if (y < 1) return null;

        };

                    r.current.innerHTML = `<i data-lucide="${name}" class="${className || ''}"></i>`;
                    lucide.createIcons({ root: r.current });
                }
            }, [name, className]);
            return <span ref={r} style={{ display: 'contents' }}></span>;
        };

        const attachmentKinds = ['Račun', 'Garancija', 'Ostalo'];
        const attachmentRefs = item => (Array.isArray(item?.attachments) ? item.attachments : []).filter(a => a && typeof a.id === 'string' && typeof a.name === 'string').map(a => ({ id: a.id, name: a.name, kind: attachmentKinds.includes(a.kind) ? a.kind : 'Ostalo', mime: textValue(a.mime) || 'image/jpeg', ...(typeof a.driveFileId === 'string' ? {driveFileId:a.driveFileId} : {}), ...(typeof a.sha256 === 'string' ? {sha256:a.sha256} : {}), ...(Number.isFinite(a.size) ? {size:a.size} : {}), ...(typeof a.storage === 'string' ? {storage:a.storage} : {}) }));
        const legacyAttachments = item => ['receiptImage', 'warrantyImage'].filter(key => safeImage(item?.[key])).map(key => ({ id: key, name: key === 'receiptImage' ? 'Stari račun' : 'Stara garancija', kind: key === 'receiptImage' ? 'Račun' : 'Garancija', legacy: true, dataUrl: item[key] }));
        const imageData = value => typeof value === 'string' && /^data:image\/(jpeg|png|webp|gif);base64,/i.test(value);
        const readAttachment = async file => {
            if (!/^image\/(png|jpeg|gif|webp|bmp|avif)$/i.test(file.type)) throw new Error('Izaberite podržanu sliku (PNG, JPEG, GIF, WebP, BMP ili AVIF).');
            const dataUrl = URL.createObjectURL(file);
            try {
                await new Promise((resolve, reject) => { const img = new Image(); img.onload = () => img.width && img.height ? resolve() : reject(new Error()); img.onerror = reject; img.src = dataUrl; });
                const sha256 = await window.attachmentService.sha256(file);
                return { id: crypto.randomUUID(), name: file.name, kind: 'Račun', mime: file.type, size: file.size, original: file, sha256, dataUrl };
            } catch { URL.revokeObjectURL(dataUrl); throw new Error('Slika nije čitljiva. Original nije poslat.'); }
        };

        function DriveConnection() {
            const service = window.attachmentService;
            const [status, setStatus] = useState(service.getStatus());
            useEffect(() => service.subscribe(() => setStatus(service.getStatus())), [service]);
            const connect = async () => { try { await service.connect(); } catch (error) { setStatus({state:'error',message:error.message}); } };
            return <div className="no-print border rounded-xl p-3 space-y-2 bg-slate-50" aria-label="Drive povezivanje">
                <p className="font-bold">{service.mode === 'simulated-drive' ? 'Simulacija Drive povezivanja' : 'Google Drive — priprema'}</p>
                <p role="status" className="drive-connection-status">{status.state === 'connected' ? 'Povezan: ' + status.account : status.state === 'connecting' ? 'Povezivanje...' : 'Drive nije povezan.'}</p>
                {status.message && <p role="alert" className="text-red-700">{status.message}</p>}
                <p className="text-sm">Pristup drive.file obuhvata fajlove koje aplikacija kreira ili joj odobrite; nije ograničen samo jednim folderom.</p>
                <button type="button" disabled={status.state === 'connecting'} onClick={connect} className="border border-blue-300 text-blue-700 rounded-xl px-3 py-2">{status.state === 'expired' || status.state === 'error' ? 'Ponovo poveži Drive' : status.state === 'connected' ? 'Obnovi Drive vezu' : 'Poveži Drive'}</button>
                {status.state === 'connected' && <button type="button" onClick={() => service.disconnect()} className="border rounded-xl px-3 py-2 ml-2">Prekini lokalnu vezu</button>}
                {!service.writesEnabled && <p className="text-sm">Folderi i upload su zaključani do zasebnog odobrenja. Povezivanje samo po sebi ne čuva priloge.</p>}
            </div>;
        }

        function AttachmentViewer({ attachment, user, onClose }) {
            const [src, setSrc] = useState(null), [error, setError] = useState(''), [attempt, setAttempt] = useState(0);
            const [zoom, setZoom] = useState(false), [printPreview, setPrintPreview] = useState(false);
            const dialog = useRef(null);
            useEffect(() => { const el = dialog.current; el.showModal(); return () => el.close(); }, []);
            useEffect(() => {
                let active = true, objectUrl; setSrc(null); setError('');
                (async () => {
                    try {
                        const value = attachment.dataUrl || await window.attachmentService?.load({ userId: user.uid, ...attachment });
                        const display = value instanceof Blob ? (objectUrl = URL.createObjectURL(value)) : value;
                        if (!(attachment.legacy ? safeImage(display) : (imageData(display) || (typeof display === 'string' && display.startsWith('blob:'))))) throw new Error();
                        if (active) setSrc(display); else if (objectUrl) URL.revokeObjectURL(objectUrl);
                    } catch (error) { if (active) setError('Prilog nije učitan. ' + error.message); }
                })();
                return () => { active = false; if (objectUrl) URL.revokeObjectURL(objectUrl); };
            }, [attachment, user.uid, attempt]);
            const download = () => {
                if (!(imageData(src) || src?.startsWith('blob:'))) { setError('Preuzimanje ovog starog spoljnog linka nije dostupno bez konfigurisanog servisa.'); return; }
                const link = document.createElement('a'); link.href = src;
                link.download = attachment.name.replace(/[^\p{L}\p{N}._ -]/gu, '_') || 'prilog';
                document.body.appendChild(link); link.click(); link.remove();
            };
            return <dialog ref={dialog} onCancel={e => { e.preventDefault(); onClose(); }} aria-label="Pregled priloga" className="attachment-dialog w-[95vw] max-w-4xl max-h-[95vh] rounded-2xl p-4 border shadow-xl">
                <div className="no-print flex flex-wrap gap-2 justify-between items-center mb-4">
                    <h3 className="font-bold break-all">{attachment.kind}: {attachment.name}</h3>
                    <button type="button" onClick={onClose} className="border rounded-xl px-3 py-2">Zatvori pregled</button>
                </div>
                {error && <p role="alert" className="no-print text-red-700">{error} <button type="button" onClick={() => setAttempt(n => n + 1)} className="underline">Pokušaj ponovo</button></p>}
                {!src && !error && <p role="status">Učitavanje priloga...</p>}
                {src && <>
                    <div className="no-print flex flex-wrap gap-2 mb-4">
                        <button type="button" className="border rounded-xl px-3 py-2" onClick={() => setZoom(v => !v)}>{zoom ? 'Uklopi sliku' : 'Uvećaj'}</button>
                        <button type="button" className="border rounded-xl px-3 py-2" onClick={download}>Preuzmi</button>
                        <button type="button" className="border rounded-xl px-3 py-2" onClick={() => { setPrintPreview(v => !v); setZoom(false); }}>{printPreview ? 'Nazad na pregled' : 'Prikaz za štampu'}</button>
                    </div>
                    {printPreview && <div className="no-print mb-4"><p>Izaberi štampač ili sačuvaj ovaj prilog kao PDF.</p><button type="button" className="border rounded-xl px-3 py-2" onClick={() => window.print()}>Štampaj / Sačuvaj kao PDF</button></div>}
                    <div className={printPreview ? 'print-sheet bg-white p-4 border' : 'overflow-auto'}>
                        {printPreview && <p className="font-bold mb-3 break-all">{attachment.kind}: {attachment.name}</p>}
                        <img style={zoom ? { width: "200%" } : undefined} src={src} alt={attachment.name} onError={() => { setSrc(null); setError('Slika ne može da se prikaže.'); }} className={zoom ? 'max-w-none' : 'max-w-full max-h-[65vh] mx-auto object-contain'} />
                    </div>
                </>}
            </dialog>;
        }

        function AttachmentList({ attachments, user, onKindChange }) {
            const [opened, setOpened] = useState(null);
            return <section className="attachment-list space-y-3" aria-label="Prilozi">
                {attachments.length === 0 && <p className="text-slate-500">Nema priloga.</p>}

                    <button type="button" aria-label={"Prikaži prilog: " + a.name} disabled={!a.legacy && !a.dataUrl && !a.driveFileId} onClick={() => setOpened(a)} className="attachment-open-button text-blue-700 border rounded-xl px-3 py-2">Prikaži prilog</button>
                </div>)}
                {opened && <AttachmentViewer attachment={opened} user={user} onClose={() => setOpened(null)} />}
            </section>;
        }


        const draftConflictMessage = 'Postoji drugi nezavršen nacrt. Vratite se na listu i izaberite „Nastavi nacrt / novi unos“ da ga nastavite. Izmena izabrane garancije nije otvorena; nacrt je sačuvan.';
        const draftMatchesRecord = (draft, record) => !draft || (record ? draft.edit === true && draft.id === record.id : draft.edit === false);

        function App() {
            const [warranties, setWarranties] = useState([]);
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [view, setView] = useState('list');
            const [selected, setSelected] = useState(null);
            const [search, setSearch] = useState('');
            const [listState, setListState] = useState('loading');
            const [retry, setRetry] = useState(0);
            const [authError, setAuthError] = useState('');
            const [formBusy, setFormBusy] = useState(false);
            const [notice, setNotice] = useState('');
            const filtered = warranties.filter(w => textValue(w.name).toLowerCase().includes(search.toLowerCase()));

            useEffect(() => {
                let unsubscribe, active = true;
                setLoading(true); setAuthError('');
                const fail = () => { if (active) { setAuthError('Povezivanje nije uspelo. Pokušajte ponovo.'); setLoading(false); } };
                const connect = () => {
                    if (!window.firebaseDeps) return;
                    clearInterval(timer); clearTimeout(timeout);
                    try {
                        unsubscribe = window.firebaseDeps.onAuthStateChanged(window.firebaseDeps.auth, u => {
                            if (!active) return;
                            setUser(u); setWarranties([]); setSelected(null); setView('list'); setLoading(false);
                        }, fail);
                    } catch { fail(); }
                };
                const timer = setInterval(connect, 100);
                const timeout = setTimeout(() => { clearInterval(timer); fail(); }, 10000);
                connect();
                return () => { active = false; clearInterval(timer); clearTimeout(timeout); if (unsubscribe) unsubscribe(); };
            }, [retry]);

            useEffect(() => {
                if (!user || !window.firebaseDeps) return;
                let active = true, unsubscribe;
                setListState('loading');
                const { db, appId, collection, onSnapshot } = window.firebaseDeps;
                const fail = () => { if (active) setListState('error'); };
                try {
                    unsubscribe = onSnapshot(collection(db, 'artifacts', appId, 'users', user.uid, 'warranties'), snapshot => {
                        if (!active) return;
                        setWarranties(snapshot.docs.map(d => ({ ...d.data(), id: d.id })).filter(w => w.id !== 'gp-live-integration-test-001'));
                        setListState('ready');
                    }, fail);
                } catch { fail(); }
                return () => { active = false; if (unsubscribe) unsubscribe(); };
            }, [user, retry]);

            const openForm = (record=null) => {
                try { const d=window.attachmentService.getDraft(user.uid);
                    if (record && !draftMatchesRecord(d, record)) throw new Error(draftConflictMessage);
                    setAuthError('');
                    if(d) { setSelected(d.edit ? (warranties.find(w=>w.id===d.id)||{id:d.id}) : null); setView(d.edit?'edit':'add'); }
                    else {setSelected(record);setView(record?'edit':'add');}
                } catch(e) {setAuthError(e.message);}
            };
            const login = async () => {
                try { setAuthError(''); await window.firebaseDeps.signInWithPopup(window.firebaseDeps.auth, window.firebaseDeps.provider); }
                catch { setAuthError('Prijava nije uspela. Pokušajte ponovo.'); }
            };
            const logout = async () => {
                try { window.attachmentService.disconnect(); await window.firebaseDeps.signOut(window.firebaseDeps.auth); }
                catch { setAuthError('Odjava nije uspela. Pokušajte ponovo.'); }
            };

            if (loading) return <div role="status" className="min-h-screen flex items-center justify-center">Učitavanje...</div>;
            if (authError && !window.firebaseDeps) return <div role="alert" className="p-6">{authError} <button onClick={() => setRetry(r => r + 1)}>Pokušaj ponovo</button></div>;

            if (!user) return (
                <div className="min-h-screen flex items-center justify-center p-6 bg-slate-100">
                    <div className="bg-white p-8 rounded-2xl shadow-xl text-center max-w-sm w-full">
                        <Icon name="shield-check" className="w-12 h-12 text-blue-600 mx-auto mb-4" />
                        <h1 className="text-2xl font-bold mb-6">GarancijePro</h1>
                        {authError && <p role="alert">{authError} <button onClick={() => setRetry(r => r + 1)}>Pokušaj ponovo</button></p>}
                        <button onClick={login} className="w-full bg-slate-900 text-white py-3 rounded-xl font-bold flex items-center justify-center gap-2">
                            <Icon name="log-in" className="w-5 h-5" /> Prijavi se Google-om
                        </button>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen pb-10">
                    <header className="bg-white border-b p-4 sticky top-0 z-10">
                        <div className="app-header-content max-w-5xl mx-auto flex justify-between items-center">
                            <div className="app-brand flex items-center gap-2" onClick={() => { if (!formBusy && view !== 'add' && view !== 'edit') setView('list'); }}>
                                <div className="bg-blue-600 p-1.5 rounded-lg text-white"><Icon name="shield-check" className="w-5 h-5" /></div>
                                <span className="app-brand-title font-bold text-xl">GarancijePro</span>
                            </div>
                            <div className="flex gap-2">
                                <button disabled={view === 'add' || view === 'edit' || formBusy} onClick={() => openForm()} className="bg-blue-600 text-white px-4 py-2 rounded-lg font-bold text-sm">Dodaj</button>
                                <button aria-label="Odjavi se" disabled={view === 'add' || view === 'edit' || formBusy} onClick={logout} className="p-2 text-slate-400"><Icon name="log-out" className="w-5 h-5" /></button>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-5xl mx-auto p-4">
                        <div className="mb-4"><DriveConnection /></div>
                        {notice && <p role="status" className="mb-3">{notice}</p>}
                        {view === "list" && <button className="border rounded-xl px-3 py-2 mb-3" onClick={() => openForm()}>Nastavi nacrt / novi unos</button>}
                        {authError && <p role="alert">{authError}</p>}
                        {view === 'list' && (
                            <div className="space-y-4">
                                <input type="text" placeholder="Pretraži..." value={search} onChange={e => setSearch(e.target.value)} className="w-full p-3 border rounded-xl" />
                                {listState === 'loading' && <p role="status">Učitavanje garancija...</p>}
                                {listState === 'error' && <div role="alert">Garancije nisu učitane. <button onClick={() => setRetry(r => r + 1)} className="text-blue-600 underline">Pokušaj ponovo</button></div>}
                                {listState === 'ready' && filtered.length === 0 && <p role="status">{warranties.length === 0 ? 'Još nema garancija. Dodajte prvu garanciju.' : 'Nema rezultata za ovu pretragu.'}</p>}
                                <div className="warranty-grid grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
                                    {(listState === 'ready' ? filtered : []).map(w => {
                                        const exp = calcExp(w.purchaseDate, w.baseMonths, w.extendedMonths);
                                        const st = getStyle(calcDays(exp));
                                        return (
                                            <div key={w.id} onClick={() => { setSelected(w); setView('detail'); }} className="warranty-card bg-white p-5 rounded-2xl border shadow-sm cursor-pointer">
                                                <div className="warranty-card-meta flex justify-between mb-2">
                                                    <span className="warranty-card-category text-xs font-bold text-slate-400 uppercase">{textValue(w.category) || 'Ostalo'}</span>
                                                    <span className={`warranty-card-status text-[10px] font-bold uppercase px-2 py-1 rounded-full ${st.bg} ${st.c}`}>{st.l}</span>
                                                </div>
                                                <h3 className="warranty-card-title font-bold text-lg mb-4">{textValue(w.name) || 'Bez naziva'}</h3>
                                                <div className="text-xs text-slate-500 border-t pt-3">Ističe: {fmtDate(exp)}</div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}
                        {(view === 'add' || view === 'edit') && <AddForm key={view === 'edit' ? selected.id : 'new'} initial={view === 'edit' ? selected : null} onBusy={setFormBusy} onCancel={() => setView(view === 'edit' ? 'detail' : 'list')} onSave={() => setView('list')} onDiscard={() => { setSelected(null); setAuthError(''); setView('list'); setNotice('Nacrt je odbačen.'); }} user={user} />}
                        {view === 'detail' && selected && <Detail onEdit={() => openForm(selected)} item={selected} onBack={() => setView('list')} user={user} />}
                    </main>
                </div>
            );
        }

        function AddForm({ onCancel, onSave, onDiscard, onBusy, user, initial = null }) {
            const service = window.attachmentService;
            const savedDraft = service.getDraft(user.uid);
            const draftConflict = !draftMatchesRecord(savedDraft, initial);
            const restored = useRef(draftConflict ? null : savedDraft);
            const draftOperation = useRef(restored.current?.operationId || 'op-' + crypto.randomUUID());
            const disposed = useRef(false), discardingRef = useRef(false);
            const [discarding, setDiscarding] = useState(false);
            const [sealed, setSealed] = useState(!!restored.current?.sealed);
            const [form, setForm] = useState(() => restored.current?.metadata || ({
                name: textValue(initial?.name), category: textValue(initial?.category) || 'Alati',
                purchaseDate: initial ? (parseDate(initial.purchaseDate) ? initial.purchaseDate : '') : dateInput(),
                baseMonths: initial ? (monthsValue(initial.baseMonths, 1) ?? '') : 24,
                extendedMonths: initial ? (monthsValue(initial.extendedMonths ?? 0, 0) ?? '') : 0,
                store: textValue(initial?.store), description: textValue(initial?.description)
            }));
            const [attachments, setAttachments] = useState(() => restored.current?.attachments || attachmentRefs(initial));
            const [pending, setPending] = useState(() => restored.current?.pending || []);
            const pendingUrls = useRef(new Set());
            const cameraInput = useRef(null), galleryInput = useRef(null);

            const legacy = legacyAttachments(initial);
            const needsService = pending.length > 0 || attachments.length > 0;
            const malformedAttachments = initial?.attachments != null && (!Array.isArray(initial.attachments) || attachmentRefs(initial).length !== initial.attachments.length);
            const [saving, setSaving] = useState(false);
            const [processing, setProcessing] = useState(false);
            const [error, setError] = useState('');
            const [imageError, setImageError] = useState('');
            const savingRef = useRef(false), processingRef = useRef(0);
            const mounted = useRef(true);
            useEffect(() => {
                mounted.current = true;
                return () => { mounted.current = false; for (const url of pendingUrls.current) URL.revokeObjectURL(url); };
            }, []);
            useEffect(() => { onBusy(saving || discarding); return () => onBusy(false); }, [saving, discarding, onBusy]);
            useEffect(() => {
                if (!mounted.current || disposed.current || discardingRef.current) return;
                try {
                    if (!draftMatchesRecord(service.getDraft(user.uid), initial)) throw new Error(draftConflictMessage);
                    const {id, ...base} = initial || {}; service.stageDraft({userId:user.uid,id:initial?.id || null,base:initial ? base : null,metadata:form,attachments,pending,operationId:draftOperation.current});
                }
                catch(e) { setError(e.message); }
            }, [form,attachments,pending]);
            const change = (field, value) => { if(!sealed && !disposed.current && !discardingRef.current) setForm(previous => ({ ...previous, [field]: value })); };
            const expiry = calcExp(form.purchaseDate, form.baseMonths, form.extendedMonths);

            const handleFile = async e => {
                if (disposed.current || discardingRef.current || savingRef.current || processingRef.current) return;
                const files = Array.from(e.target.files); e.target.value = '';
                if (!files.length) return;
                processingRef.current++; setProcessing(true); setImageError('');
                try {
                    const results = await Promise.allSettled(files.map(readAttachment));
                    const good = results.filter(r => r.status === 'fulfilled').map(r => r.value);
                    if (!mounted.current || disposed.current || discardingRef.current) { for (const a of good) URL.revokeObjectURL(a.dataUrl); return; }
                    for (const a of good) pendingUrls.current.add(a.dataUrl);
                    setPending(previous => {
                        if (disposed.current || discardingRef.current) return previous;
                        const result=[...previous];
                        for(const a of good) {
                            const index=result.findIndex(p=>!p.original && p.sha256===a.sha256 && p.size===a.size);
                            if(index>=0) result[index]={...a,id:result[index].id,kind:result[index].kind};
                            else if(!sealed) result.push(a);
                            else setImageError('Izabrani fajl ne odgovara originalima sacuvanog nacrta.');
                        } return result;
                    });
                    const failed = results.filter(r => r.status === 'rejected').length;
                    if (failed) setImageError(failed + ' slika nije obrađeno. Prethodni prilozi su sačuvani; izaberite neuspele slike ponovo.');
                } finally {
                    processingRef.current--;
                    if (mounted.current) setProcessing(processingRef.current > 0);
                }
            };
            const changeKind = (id, kind) => {
                if (disposed.current || discardingRef.current) return;
                setAttachments(previous => previous.map(a => a.id === id ? { ...a, kind } : a));
                setPending(previous => previous.map(a => a.id === id ? { ...a, kind } : a));
            };

            const submit = async e => {
                e.preventDefault();
                if (disposed.current || discardingRef.current) return;
                if (draftConflict) { setError(draftConflictMessage); return; }
                if (savingRef.current || processingRef.current) return;
                if (!form.name.trim() || !expiry || form.purchaseDate > dateInput() || form.description.length > 150) {
                    setError('Unesite naziv, ispravan datum kupovine koji nije u budućnosti, celo trajanje u mesecima i opis do 150 karaktera.');
                    return;
                }
                if (malformedAttachments) { setError('Postojeći podaci o prilozima nisu podržani. Čuvanje je zaustavljeno da bi ostali očuvani.'); return; }
                if (needsService && !service?.saveWarranty) { setError('Servis priloga nije konfigurisan. Nema čuvanja niti slanja priloga. Unos ostaje u formi.'); return; }
                savingRef.current = true; setSaving(true); setError('');
                try {
                    if (!draftMatchesRecord(service.getDraft(user.uid), initial)) throw new Error(draftConflictMessage);
                    const {id, ...base} = initial || {};
                    const data = { ...form, name: form.name.trim(), store: form.store.trim(), baseMonths: Number(form.baseMonths), extendedMonths: Number(form.extendedMonths) };
                    service.stageDraft({userId:user.uid,id:initial?.id || null,base:initial ? base : null,metadata:data,attachments,pending,operationId:draftOperation.current});
                    setSealed(true);
                    await service.saveWarranty({userId:user.uid,newAttachments:pending});
                    if (mounted.current) onSave();
                } catch (error) {
                    if (mounted.current) setError('Čuvanje nije uspelo. Unos je sačuvan u ovoj formi. ' + error.message);
                } finally {
                    savingRef.current = false;
                    if (mounted.current) setSaving(false);
                }
            };

            const discard = async () => {
                if (disposed.current || discardingRef.current || savingRef.current || processingRef.current || sealed) return;
                discardingRef.current = true; setDiscarding(true);
                try {
                    const d = service.getDraft(user.uid);
                    if (!d || !draftMatchesRecord(d, initial) || d.operationId !== draftOperation.current) throw new Error('Nacrt se promenio. Odbacivanje je zaustavljeno.');
                    const expected = window.garancijeFingerprint(d);
                    if (!window.confirm('Odbaci ovaj nezavršeni nacrt? Njegovi nesačuvani podaci i lokalni prilozi biće uklonjeni sa ovog uređaja. Sačuvane garancije i fajlovi na Drive-u neće biti obrisani.')) return;
                    await service.discardDraft({userId:user.uid,id:d.id,operationId:d.operationId,expected});
                    disposed.current = true; mounted.current = false;
                    for (const url of pendingUrls.current) URL.revokeObjectURL(url);
                    pendingUrls.current.clear(); setPending([]); setAttachments([]);
                    if (cameraInput.current) cameraInput.current.value = '';
                    if (galleryInput.current) galleryInput.current.value = '';
                    onDiscard();
                } catch (error) { if (mounted.current) setError(error.message); }
                finally { discardingRef.current = false; if (mounted.current) setDiscarding(false); }
            };

            if (draftConflict) return <div role="alert" className="bg-white p-6 rounded-2xl border max-w-xl mx-auto"><p>{draftConflictMessage}</p><button type="button" onClick={onCancel} className="mt-4 border rounded-xl px-3 py-2">Nazad</button></div>;

            return (
                <form onSubmit={submit} aria-busy={saving || processing || discarding} className="bg-white p-6 rounded-2xl border shadow-sm space-y-4 max-w-xl mx-auto">
                    <h2 className="text-xl font-bold mb-4">{initial ? 'Izmena garancije' : 'Nova garancija'}</h2>
                    <p className="text-sm mb-3">Nacrt se cuva na ovom uredjaju. Odustani zatvara formu i zadrzava nacrt.</p>
                    {sealed && <p role="status">Nastavak zapocetog cuvanja: podaci su zakljucani dok se ishod ne potvrdi. Nedostajuce originale izaberite ponovo.</p>}
                    {error && <p role="alert" className="text-red-700">{error}</p>}
                    <fieldset disabled={saving || discarding} className="space-y-4">
                        <label className="block">Naziv proizvoda
                            <input type="text" required value={form.name} disabled={sealed} onChange={e => change('name', e.target.value)} className="w-full p-3 border rounded-xl" />
                        </label>
                        <label className="block">Prodavnica (opciono)
                            <input type="text" value={form.store} disabled={sealed} onChange={e => change('store', e.target.value)} className="w-full p-3 border rounded-xl" />
                        </label>
                        <label className="block">Opis (opciono)
                            <textarea maxLength={150} aria-describedby="description-count" value={form.description} disabled={sealed} onChange={e => change('description', e.target.value)} className="w-full p-3 border rounded-xl" />
                            <span id="description-count" className="text-sm text-slate-500">{form.description.length}/150 karaktera</span>
                        </label>
                        <div className="grid sm:grid-cols-2 gap-4">
                            <label>Datum kupovine<input type="date" required max={dateInput()} value={form.purchaseDate} disabled={sealed} onChange={e => change('purchaseDate', e.target.value)} className="w-full p-3 border rounded-xl" /></label>
                            <label>Trajanje (meseci)<input type="number" required min="1" step="1" value={form.baseMonths} disabled={sealed} onChange={e => change('baseMonths', e.target.value)} className="w-full p-3 border rounded-xl" /></label>
                            <label>Produžena garancija (meseci)<input type="number" required min="0" step="1" value={form.extendedMonths} disabled={sealed} onChange={e => change('extendedMonths', e.target.value)} className="w-full p-3 border rounded-xl" /></label>
                        </div>
                        <p role="status" className="bg-slate-50 p-3 rounded-xl">Ističe: {fmtDate(expiry)}</p>
                        {(service?.mode === 'simulated-drive' || !service?.writesEnabled) && <div className="bg-slate-50 p-3 rounded-xl text-sm">
                            {service?.mode === 'simulated-drive' ? 'SIMULACIJA: podaci i slike ostaju u lokalnom demo skladistu i posle osvezavanja. Nema stvarnog Drive-a.' : 'Lokalna priprema: produkcioni upis nije aktiviran.'}
                        </div>}
                        <div className="p-4 border-2 border-dashed rounded-xl space-y-3">
                            <p id="attachment-picker-help" className="text-sm text-slate-600">Slikaj račun kamerom ili dodaj slike iz galerije. Prethodni prilozi ostaju sačuvani.</p>
                            <input ref={cameraInput} type="file" accept="image/*" capture="environment" aria-label="Slika računa iz kamere" disabled={saving || processing} onChange={handleFile} className="hidden" />
                            <input ref={galleryInput} type="file" accept="image/*" multiple aria-label="Slike iz galerije" disabled={saving || processing} onChange={handleFile} className="hidden" />
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                <button type="button" disabled={saving || processing} aria-describedby="attachment-picker-help" onClick={() => cameraInput.current?.click()} className="min-h-[48px] w-full px-4 py-3 rounded-xl bg-blue-600 text-white font-bold focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 disabled:opacity-50 disabled:cursor-not-allowed">Slikaj račun</button>
                                <button type="button" disabled={saving || processing} aria-describedby="attachment-picker-help" onClick={() => galleryInput.current?.click()} className="min-h-[48px] w-full px-4 py-3 rounded-xl border border-blue-600 text-blue-700 font-bold focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 disabled:opacity-50 disabled:cursor-not-allowed">Dodaj iz galerije</button>
                            </div>
                        </div>
                        {processing && <p role="status">Obrada fotografija...</p>}
                        <AttachmentList attachments={[...legacy, ...attachments, ...pending]} user={user} onKindChange={sealed ? null : changeKind} />
                        {legacy.length > 0 && <p className="text-sm text-slate-500">Stari inline prilozi ostaju u zapisu. Migracija nije izvršena; sadržaj se i dalje prenosi sa tim zapisom.</p>}
                        {imageError && <p role="alert" className="text-red-700">{imageError}</p>}
                        <div className="flex flex-wrap gap-2 pt-4">
                            <button type="button" onClick={onCancel} className="flex-1 py-3 border border-slate-300 rounded-xl font-bold text-slate-500">Odustani</button>
                            <button type="submit" disabled={saving || processing} className="flex-1 py-3 bg-blue-600 text-white rounded-xl font-bold disabled:opacity-50">{saving ? 'Čuvanje...' : error ? 'Pokušaj ponovo' : 'Sačuvaj'}</button>
                        </div>
                        <div className="border-t pt-4">
                            <button type="button" onClick={discard} disabled={saving || processing || discarding || sealed} className="w-full min-w-0 min-h-[48px] whitespace-normal break-words px-4 py-3 border border-red-300 text-red-700 rounded-xl font-bold disabled:opacity-50 disabled:cursor-not-allowed">Odbaci nacrt</button>
                        </div>
                    </fieldset>
                </form>
            );
        }

        function Detail({ item, onBack, onEdit, user }) {
            const exp = calcExp(item.purchaseDate, item.baseMonths, item.extendedMonths);
            const service = window.attachmentService;
            const [deleteError, setDeleteError] = useState('');
            const canDelete = (() => {
                try {
                    if (!service?.assertWriteAllowed) return false;
                    service.assertWriteAllowed(user?.uid);
                    return true;
                } catch { return false; }
            })();
            const del = async () => {
                setDeleteError('');
                try {
                    if (!service?.assertWriteAllowed) throw new Error('Servis za upis nije dostupan.');
                    service.assertWriteAllowed(user?.uid);
                    if (!confirm('Obrisati?')) return;
                    service.assertWriteAllowed(user?.uid);
                    const { db, appId, doc, deleteDoc } = window.firebaseDeps;
                    await deleteDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'warranties', item.id));
                    onBack();
                } catch (error) {
                    setDeleteError('Brisanje nije uspelo. ' + error.message);
                }
            };
            return (
                <div className="bg-white rounded-2xl border shadow-sm overflow-hidden max-w-xl mx-auto">
                    <div className="p-6 border-b flex justify-between items-center">
                        <button onClick={onBack}><Icon name="arrow-left" className="w-6 h-6" /></button>
                        <button onClick={onEdit} className="text-blue-600 font-bold">Izmeni</button>
                        <button aria-label="Obriši garanciju" disabled={!canDelete} onClick={del} className="text-red-500 disabled:opacity-50 disabled:cursor-not-allowed"><Icon name="trash-2" className="w-6 h-6" /></button>
                    </div>
                    <div className="p-6 space-y-6">
                        {deleteError && <p role="alert" className="text-red-700">{deleteError}</p>}
                        <div>
                            <span className="text-xs font-bold text-blue-600 uppercase">{textValue(item.category) || 'Ostalo'}</span>
                            <h2 className="text-2xl font-bold">{textValue(item.name) || 'Bez naziva'}</h2>
                        </div>
                        <div className="grid grid-cols-2 gap-4 bg-slate-50 p-4 rounded-xl">
                            <div><span className="text-[10px] uppercase font-bold text-slate-400">Kupljeno</span><p className="font-bold">{fmtDate(parseDate(item.purchaseDate))}</p></div>
                            <div><span className="text-[10px] uppercase font-bold text-slate-400">Ističe</span><p className="font-bold text-blue-600">{fmtDate(exp)}</p></div>
                        </div>
                        {!exp && <p role="status">Ovaj zapis ima nepotpune ili neispravne podatke. Izmenite ga da biste dobili tačan datum isteka.</p>}
                        {textValue(item.store) && <p><strong>Prodavnica:</strong> {item.store}</p>}
                        {textValue(item.description) && <p className="break-words"><strong>Opis:</strong> {item.description}</p>}
                        <h3 className="font-bold">Prilozi</h3>
                        <AttachmentList attachments={[...legacyAttachments(item), ...attachmentRefs(item)]} user={user} />
                        {legacyAttachments(item).length > 0 && <p className="text-sm text-slate-500">Stari inline prilozi su već deo učitanog zapisa; nisu migrirani.</p>}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
